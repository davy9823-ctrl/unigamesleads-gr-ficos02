<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1631">
<title>Unigames · Monte seu combo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0a1631; --navy2:#0d1b3e; --card:#122549; --card2:#162c56;
  --line:#1e3a6b; --blue:#2563eb; --sky:#a9cbf5; --sky2:#7fb3f0;
  --txt:#ffffff; --txt2:#c8daf5; --txt3:#8ba5cc; --ok:#34d399;
}
html,body{background:var(--navy);min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--txt);padding-bottom:132px;
  background-image:radial-gradient(circle at 12% 8%,rgba(37,99,235,.16),transparent 42%),
                   radial-gradient(circle at 88% 92%,rgba(37,99,235,.12),transparent 45%);
  background-attachment:fixed;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* HEADER */
.hd{padding:22px 0 18px;text-align:center}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.logo span{display:block;font-size:8px;letter-spacing:3.6px;font-weight:700;color:var(--sky);margin-top:3px}
.pill{display:inline-block;background:var(--sky);color:#0d1b3e;font-size:11px;font-weight:800;
  padding:8px 18px;border-radius:99px;margin-top:16px;letter-spacing:.4px;text-transform:uppercase}

/* HERO */
.hero h1{font-size:29px;font-weight:800;line-height:1.08;letter-spacing:-.7px;margin:14px 0 6px;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--sky)}
.hero p{font-size:13.5px;color:var(--txt2);line-height:1.5}

/* PRODUTO */
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:18px}
.prod-img{width:100%;aspect-ratio:4/3;background:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;display:flex;align-items:center;justify-content:center;font-size:54px}
.prod-body{padding:16px}
.prod-body h2{font-size:17px;font-weight:800;line-height:1.25;margin-bottom:10px}
.carac{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.carac li{font-size:12.5px;color:var(--txt2);padding-left:20px;position:relative;line-height:1.45}
.carac li:before{content:'✓';position:absolute;left:0;color:var(--sky);font-weight:800}
.pbase{border-top:1px solid var(--line);padding-top:12px}
.pbase small{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.pbase strong{display:block;font-size:27px;font-weight:800;margin-top:2px;letter-spacing:-.6px}
.pbase .avista{display:block;font-size:11.5px;color:var(--txt3);margin-top:3px;font-weight:600}

/* SEÇÕES */
.sec{margin-top:26px}
.sec-t{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:-.2px;margin-bottom:4px}
.sec-t em{font-style:normal;color:var(--sky)}
.sec-s{font-size:12px;color:var(--txt3);margin-bottom:13px;line-height:1.45}

/* ITEM */
.it{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px;
  display:flex;gap:11px;align-items:center;margin-bottom:9px;cursor:pointer;transition:border-color .16s,background .16s}
.it.on{border-color:var(--sky2);background:var(--card2)}
.it-img{width:52px;height:52px;border-radius:10px;background:#fff;flex-shrink:0;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:22px}
.it-tx{flex:1;min-width:0}
.it-tx h4{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:2px}
.it-tx p{font-size:11px;color:var(--txt3);line-height:1.4}
.it-tx b{display:block;font-size:13px;font-weight:800;color:var(--sky);margin-top:4px}
.it-tx b s{color:var(--txt3);font-weight:600;font-size:11px;margin-right:5px}
.stp{display:inline-flex;align-items:center;gap:2px;margin-top:8px;background:var(--navy2);
  border:1px solid var(--line);border-radius:99px;padding:2px}
.stp-b{width:28px;height:28px;border:0;background:transparent;color:var(--sky);font-size:17px;
  font-weight:800;font-family:inherit;border-radius:99px;cursor:pointer;line-height:1}
.stp-b:disabled{color:var(--txt3);opacity:.4}
.stp-b:active:not(:disabled){background:var(--line)}
.stp-n{min-width:24px;text-align:center;font-size:13px;font-weight:800;color:var(--txt)}
.it-tx b i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--txt3);margin-top:2px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent;transition:all .16s}
.it.on .chk{background:var(--sky);border-color:var(--sky);color:#0d1b3e}
.pac .chk{border-color:rgba(169,203,245,.5)}
.pac.on .chk{background:var(--sky);border-color:var(--sky);color:#0d1b3e}

/* PACOTE */
.pac{background:linear-gradient(148deg,#1c3d78,#0f2650);border:2px solid var(--sky2);
  border-radius:18px;padding:17px;margin-top:12px;cursor:pointer;position:relative;overflow:hidden}
.pac.on{box-shadow:0 0 0 3px rgba(169,203,245,.22)}
.pac-tag{position:absolute;top:0;right:0;background:var(--sky);color:#0d1b3e;font-size:9px;font-weight:800;
  padding:5px 12px;border-bottom-left-radius:12px;letter-spacing:.7px}
.pac h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pac p{font-size:12px;color:var(--txt2);line-height:1.5;margin-bottom:13px}
.pac-inc{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pac-inc li{font-size:11.5px;color:var(--txt2);padding-left:18px;position:relative;line-height:1.4}
.pac-inc li:before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:800}
.pac-val{display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid rgba(169,203,245,.28);padding-top:12px}
.pac-val small{font-size:10px;color:var(--sky);text-transform:uppercase;letter-spacing:.7px;font-weight:700;display:block;margin-bottom:2px}
.pac-val .v{font-size:21px;font-weight:800;letter-spacing:-.5px}
.pac-val .p{font-size:11.5px;color:var(--txt2);margin-top:2px}

/* AVISOS */
.nota{background:rgba(37,99,235,.1);border:1px solid rgba(169,203,245,.25);border-radius:13px;
  padding:13px;font-size:11.5px;color:var(--txt2);line-height:1.55;margin-top:20px}
.rodape{text-align:center;padding:26px 0 8px;font-size:10.5px;color:var(--txt3);letter-spacing:.4px}

/* BARRA FIXA */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,22,49,.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:50}
.bar-in{max-width:520px;margin:0 auto}
.bar-l{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bar-l small{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;font-weight:700;display:block}
.bar-l .tot{font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.bar-l .par{font-size:11px;color:var(--txt2);margin-top:1px}
.eco{position:relative;display:flex;flex-direction:column;align-items:flex-end;
  background:linear-gradient(140deg,#1b7f5c,#0f5f45);
  border:1.5px solid rgba(52,211,153,.55);
  box-shadow:0 4px 16px rgba(16,185,129,.28), inset 0 1px 0 rgba(255,255,255,.14);
  padding:8px 14px;border-radius:14px;white-space:nowrap;line-height:1.15;
  transition:transform .18s ease}
.eco .eco-l{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:#a7f3d4}
.eco .eco-v{font-size:19px;font-weight:800;color:#eafff6;letter-spacing:-.4px;margin-top:2px}
.eco.pop{animation:ecopop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes ecopop{
  0%{transform:scale(1)}
  40%{transform:scale(1.11)}
  100%{transform:scale(1)}
}
@media(max-width:380px){
  .eco{padding:7px 11px}
  .eco .eco-v{font-size:16.5px}
}
.zap{width:100%;background:#25D366;color:#06331a;border:0;border-radius:13px;
  padding:15px;font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px}
.zap:active{transform:scale(.985)}

.load,.erro{text-align:center;padding:70px 22px;color:var(--txt3);font-size:13.5px;line-height:1.6}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--sky);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app">
  <div class="load"><div class="spin"></div>Carregando seu combo...</div>
</div>

<script>
const SUPA_URL='https://ipjlmpelgikewnhnfbbt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwamxtcGVsZ2lrZXduaG5mYmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDcyMjYsImV4cCI6MjA5MzQ4MzIyNn0.9ZF7v0tprywrEyTua_5iTKWKNPKJ5Oto2f2Q_YNx_Po';
const H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};

const money=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fator=()=>1+((Number(C&&C.juros_percent)||0)/100);
const nPar =()=>Number(C&&C.parcelas)||12;
const parcela=v=>(Number(v)||0)*fator()/nPar();
const parcTxt=v=>nPar()+'x '+money(parcela(v));
const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let C=null, ITENS=[], sel=new Set(), qtd={}, pacOn=false;
const QTD_MAX=10;
const q=id=>qtd[String(id)]||1;

const ICO={console:'🎮',notebook:'💻',celular:'📱',acessorio:'🎧'};

async function boot(){
  const slug=new URLSearchParams(location.search).get('c');
  if(!slug) return erro('Link inválido.','Escaneie novamente o QR Code da vitrine.');
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/combos?slug=eq.${encodeURIComponent(slug)}&select=*`,{headers:H});
    const d=await r.json();
    if(!d.length) return erro('Combo não encontrado.','Fale com um consultor na loja.');
    C=d[0];
    if(C.ativo===false) return erro('Combo indisponível.','Esta oferta não está mais ativa. Fale com um consultor.');
    const ri=await fetch(`${SUPA_URL}/rest/v1/combo_itens?combo_id=eq.${C.id}&select=*&order=ordem.asc`,{headers:H});
    ITENS=await ri.json();
    ITENS.forEach(i=>{ qtd[String(i.id)]=1; if(i.pre_marcado) sel.add(String(i.id)); });
    render();
  }catch(e){ erro('Não conseguimos carregar.','Verifique sua conexão e tente de novo.'); }
}

function erro(t,s){
  document.getElementById('app').innerHTML=
    `<div class="erro"><div style="font-size:42px;margin-bottom:14px">😕</div>
     <div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:7px">${t}</div>${s}</div>`;
}

/* ── cálculo ─────────────────────────────────────────────── */
function pacoteValor(){
  return (Number(C.produto_preco)||0)*(Number(C.pacote_percent)||0)/100;
}
function essenciais(){ return ITENS.filter(i=>i.essencial); }
function opcionais(){ return ITENS.filter(i=>!i.essencial); }

function calc(){
  const marcados=ITENS.filter(i=>sel.has(String(i.id)));
  const bruto=marcados.reduce((s,i)=>s+(Number(i.preco)||0)*q(i.id),0);
  const d=C.descontos||{};
  // cada unidade conta como um item na faixa de desconto
  const n=marcados.reduce((s,i)=>s+q(i.id),0);
  let pct=0;
  if(n>=5) pct=Number(d['5'])||0;
  else if(n===4) pct=Number(d['4'])||0;
  else if(n===3) pct=Number(d['3'])||0;
  else if(n===2) pct=Number(d['2'])||0;
  const desc=bruto*pct/100;
  const pac=pacOn?pacoteValor():0;
  const base=Number(C.produto_preco)||0;
  return {bruto,desc,pac,n,total:base+bruto-desc+pac};
}

function render(){
  const par=C.parcelas||12;
  const carac=(C.produto_caracteristicas||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const ico=ICO[C.categoria]||'🎮';
  const ops=opcionais(), ess=essenciais();
  const pv=pacoteValor();

  let h=`<div class="wrap">
    <div class="hd">
      <div class="logo">Unigames<span>LUGAR DE TECNOLOGIA</span></div>
      <div class="pill">${ico} Monte seu combo</div>
    </div>

    <div class="hero">
      <h1>${esc(C.titulo||'').replace(/\|/g,'<br>')}</h1>
      <p>Escolha o que faz sentido pra você. <strong style="color:var(--sky)">Quanto mais itens, maior a vantagem.</strong></p>
    </div>

    <div class="prod">
      <div class="prod-img" ${C.produto_foto?`style="background-image:url('${C.produto_foto}')"`:''}>${C.produto_foto?'':ico}</div>
      <div class="prod-body">
        <h2>${esc(C.produto_nome)}</h2>
        ${carac.length?`<ul class="carac">${carac.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
        <div class="pbase">
          <small>Aparelho em até ${nPar()}x de</small>
          <strong>${money(parcela(C.produto_preco))}</strong>
          <span class="avista">ou ${money(C.produto_preco)} à vista</span>
        </div>
      </div>
    </div>`;

  if(ops.length){
    h+=`<div class="sec">
      <div class="sec-t">Deixe seu combo <em>completo</em></div>
      <div class="sec-s">Toque para adicionar ou remover. O desconto aumenta conforme você inclui itens.</div>
      ${ops.map(itemHTML).join('')}
    </div>`;
  }

  if(ess.length){
    h+=`<div class="sec">
      <div class="sec-t">Essenciais <em>recomendados</em></div>
      <div class="sec-s">O que mais protege seu investimento no dia a dia.</div>
      ${ess.map(itemHTML).join('')}
    </div>`;
  }

  if(C.pacote_ativo!==false && pv>0){
    h+=`<div class="sec">
      <div class="sec-t">Ou leve tudo no <em>pacote</em></div>
      <div class="sec-s">Todos os essenciais reunidos em uma condição única.</div>
      <div class="pac${pacOn?' on':''}" id="pac" onclick="togglePac()">
        <div class="pac-tag" id="pac-tag">${pacOn?'ADICIONADO':'MELHOR ESCOLHA'}</div>
        <h3>🛡️ ${esc(C.pacote_nome||'Pacote Proteção Total')}</h3>
        <p>${esc(C.pacote_desc||'Todos os recursos essenciais em um só pacote, com a segurança de quem é assistência especializada há quase 20 anos.')}</p>
        ${ess.length?`<ul class="pac-inc">${ess.map(i=>`<li>${esc(i.nome)}</li>`).join('')}</ul>`:''}
        <div class="pac-val">
          <div>
            <small>Pacote em até ${par}x de</small>
            <div class="v">${money(parcela(pv))}</div>
            <div class="p">ou ${money(pv)} à vista</div>
          </div>
          <div class="chk" style="width:30px;height:30px">✓</div>
        </div>
      </div>
    </div>`;
  }

  if(C.observacao) h+=`<div class="nota">ℹ️ ${esc(C.observacao)}</div>`;

  h+=`<div class="rodape">${C.loja?'UNIGAMES '+esc(C.loja).toUpperCase()+' · ':''}LUGAR DE TECNOLOGIA</div>
  </div>

  <div class="bar">
    <div class="bar-in">
      <div class="bar-l">
        <div>
          <small id="tot-lbl">Total do combo</small>
          <div class="tot" id="tot">—</div>
          <div class="par" id="par"></div>
        </div>
        <div class="eco" id="eco" style="display:none"></div>
      </div>
      <button class="zap" onclick="enviar()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.08-.3-.15-1.26-.47-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35M12 2a10 10 0 00-8.6 15.05L2 22l5.05-1.32A10 10 0 1012 2z"/></svg>
        Falar com um consultor
      </button>
    </div>
  </div>`;

  document.getElementById('app').innerHTML=h;
  atualiza();
}

function itemHTML(i){
  const id=String(i.id), on=sel.has(id), gr=(Number(i.preco)||0)===0;
  const n=q(id), sub=(Number(i.preco)||0)*n;
  const podeQtd = !i.unidade_unica && !gr;
  const step = podeQtd ? `
    <div class="stp" onclick="event.stopPropagation()">
      <button class="stp-b" onclick="muda('${id}',-1)" ${!on||n<=1?'disabled':''}>−</button>
      <span class="stp-n" id="qn-${id}">${n}</span>
      <button class="stp-b" onclick="muda('${id}',1)" ${!on||n>=QTD_MAX?'disabled':''}>+</button>
    </div>` : '';
  return `<div class="it${on?' on':''}" data-id="${id}" onclick="toggle('${id}')">
    <div class="it-img" ${i.foto?`style="background-image:url('${i.foto}')"`:''}>${i.foto?'':(i.essencial?'🛡️':'➕')}</div>
    <div class="it-tx">
      <h4>${esc(i.nome)}</h4>
      ${i.descricao?`<p>${esc(i.descricao)}</p>`:''}
      <b id="pv-${id}">${gr?'Incluso':'+ '+parcTxt(sub)}${gr?'':`<i>${n>1?`${n} × ${money(i.preco)} · `:''}${money(sub)} à vista</i>`}</b>
      ${step}
    </div>
    <div class="chk">✓</div>
  </div>`;
}

function redesenha(id){
  const i=ITENS.find(x=>String(x.id)===String(id)); if(!i) return;
  const el=document.querySelector(`.it[data-id="${id}"]`); if(!el) return;
  const novo=document.createElement('div'); novo.innerHTML=itemHTML(i);
  el.replaceWith(novo.firstElementChild);
}

function toggle(id){
  id=String(id);
  if(sel.has(id)){ sel.delete(id); qtd[id]=1; } else sel.add(id);
  redesenha(id); atualiza();
}

function muda(id,d){
  id=String(id);
  if(!sel.has(id)) return;
  let n=q(id)+d;
  if(n<1){ sel.delete(id); n=1; }
  if(n>QTD_MAX) n=QTD_MAX;
  qtd[id]=n;
  redesenha(id); atualiza();
}

function togglePac(){
  pacOn=!pacOn;
  const p=document.getElementById('pac');
  if(p) p.classList.toggle('on',pacOn);
  const tg=document.getElementById('pac-tag');
  if(tg) tg.textContent = pacOn?'ADICIONADO':'MELHOR ESCOLHA';
  atualiza();
}

function atualiza(){
  const r=calc(), par=nPar();
  document.getElementById('tot-lbl').textContent=`Combo em até ${par}x de`;
  document.getElementById('tot').textContent=money(parcela(r.total));
  document.getElementById('par').textContent=`ou ${money(r.total)} à vista`;
  const eco=document.getElementById('eco');
  if(r.desc>0){
    const novo = money(r.desc);
    const mudou = eco.dataset.v !== novo;
    eco.dataset.v = novo;
    eco.style.display='flex';
    eco.innerHTML=`<div class="eco-l">🏷️ Você economiza</div><div class="eco-v">${novo}</div>`;
    if(mudou){
      eco.classList.remove('pop');
      void eco.offsetWidth;
      eco.classList.add('pop');
    }
  } else { eco.style.display='none'; eco.dataset.v=''; }
}

function enviar(){
  const r=calc(), par=C.parcelas||12;
  const marcados=ITENS.filter(i=>sel.has(String(i.id)));
  let t=`Olá! Vi o QR Code na loja e montei meu combo:\n\n`;
  t+=`*${C.produto_nome}* — ${money(C.produto_preco)}\n`;
  if(marcados.length){
    t+=`\n*Itens que escolhi:*\n`;
    marcados.forEach(i=>{
      const n=q(i.id), p=Number(i.preco)||0;
      const qtxt=n>1?`${n}x `:'';
      t+=`• ${qtxt}${i.nome}${p>0?' — '+money(p*n)+(n>1?` (${n} × ${money(p)})`:''):' — incluso'}\n`;
    });
  }
  if(pacOn) t+=`\n• ${C.pacote_nome||'Pacote Proteção Total'} — ${money(pacoteValor())}\n`;
  if(r.desc>0) t+=`\n_Desconto do combo: -${money(r.desc)}_\n`;
  t+=`\n*Total: ${money(r.total)} à vista*\nou ${par}x de ${money(parcela(r.total))}\n`;
  if(C.loja) t+=`\nLoja: ${C.loja}`;
  const n=(C.whatsapp||'').replace(/\D/g,'');
  location.href=(n?`https://wa.me/${n}?text=`:`https://wa.me/?text=`)+encodeURIComponent(t);
}

boot();
</script>
