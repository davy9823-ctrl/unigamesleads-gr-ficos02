<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>

<title>UniGames · Liderança</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0e1d38;--bg2:#132549;--txt:#eaf1ff;--mut:#9db2d6;--line:#25406f}
html:not(.dark){--bg:#f1f5f9;--bg2:#fff;--txt:#0f172a;--mut:#64748b;--line:#e2e8f0}
html.preto{--bg:#000;--bg2:#0a0a0a;--txt:#f5f5f5;--mut:#8a8a8a;--line:#1f1f1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{padding-bottom:60px}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px}
.hrow{display:flex;align-items:center;gap:9px}
.logo{font-weight:900;font-size:15.5px;letter-spacing:.2px}
.logo span{color:#60A5FA}
.hme{margin-left:auto;display:flex;gap:6px;align-items:center}
.hbtn{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:9px;
  padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.who{font-size:11px;color:var(--mut);margin-top:3px}
main{padding:12px;max-width:820px;margin:0 auto}
/* login */
.lg{max-width:340px;margin:14vh auto;padding:0 16px}
.lg-box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center}
.lg h1{font-size:19px;margin:0 0 4px;font-weight:900}
.lg p{font-size:12.5px;color:var(--mut);margin:0 0 20px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:.15s}
.pin-dots i.on{background:#3b82f6;transform:scale(1.15)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{padding:16px 0;border-radius:14px;background:var(--bg2);border:1px solid var(--line);
  color:var(--txt);font-size:20px;font-weight:800;cursor:pointer;font-family:inherit}
.key:active{background:#3b82f6;color:#fff}
.key.fn{font-size:14px;color:var(--mut)}
.lg-err{color:#f87171;font-size:12.5px;margin-top:14px;min-height:18px;font-weight:700}
</style>
</head>
<body>

<div id="login">
  <div class="lg"><div class="lg-box">
    <h1>UNI<span style="color:#60A5FA">GAMES</span></h1>
    <p>Liderança Comercial<br><span style="font-size:11px">Use o mesmo PIN da Rotina</span></p>
    <div class="pin-dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="keys">
      <button class="key" onclick="pin(1)">1</button><button class="key" onclick="pin(2)">2</button><button class="key" onclick="pin(3)">3</button>
      <button class="key" onclick="pin(4)">4</button><button class="key" onclick="pin(5)">5</button><button class="key" onclick="pin(6)">6</button>
      <button class="key" onclick="pin(7)">7</button><button class="key" onclick="pin(8)">8</button><button class="key" onclick="pin(9)">9</button>
      <button class="key fn" onclick="pinTema()">◐</button><button class="key" onclick="pin(0)">0</button><button class="key fn" onclick="pinDel()">←</button>
    </div>
    <div class="lg-err" id="lg-err"></div>
  </div></div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="hrow">
      <div><div class="logo">UNI<span>GAMES</span> · Liderança</div>
        <div class="who" id="who">—</div></div>
      <div class="hme">
        <button class="hbtn" onclick="cicloTema()" id="btn-tema">◐</button>
        <button class="hbtn" onclick="sair()">Sair</button>
      </div>
    </div>
  </header>
  <main>
    <div id="lc-topbar"></div>
    <div id="lc-body"></div>
  </main>
</div>

<script>
/* ═══ SUPABASE ═══ */
const SUPA_URL='https://ipjlmpelgikewnhnfbbt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwamxtcGVsZ2lrZXduaG5mYmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDcyMjYsImV4cCI6MjA5MzQ4MzIyNn0.9ZF7v0tprywrEyTua_5iTKWKNPKJ5Oto2f2Q_YNx_Po';
const HEADERS={'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'};
async function dbGet(t,p){ const r=await fetch(SUPA_URL+'/rest/v1/'+t+'?order=id.desc'+(p||''),{headers:HEADERS}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbGetSafe(t,p){ try{ return await dbGet(t,p); }catch(e){ console.warn('dbGetSafe',t,e); return []; } }
async function dbInsert(t,d){ const b=Object.assign({},d); delete b.id;
  const r=await fetch(SUPA_URL+'/rest/v1/'+t,{method:'POST',headers:HEADERS,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbUpdate(t,id,d){ const b=Object.assign({},d); delete b.id;
  const r=await fetch(SUPA_URL+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:HEADERS,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbDelete(t,id){ const r=await fetch(SUPA_URL+'/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE',headers:HEADERS}); if(!r.ok) throw new Error(await r.text()); }

/* ═══ TEMA ═══ */
const TEMAS=['dark','light','preto'], TEMA_IC={dark:'🌙',light:'☀️',preto:'⬛'};
function aplicarTema(t){
  const h=document.documentElement;
  h.classList.remove('dark','preto');
  if(t==='dark') h.classList.add('dark');
  if(t==='preto'){ h.classList.add('dark'); h.classList.add('preto'); }
  try{ localStorage.setItem('lc_tema',t); }catch(e){}
  const b=document.getElementById('btn-tema'); if(b) b.textContent=TEMA_IC[t]||'◐';
  const mt=document.querySelector('meta[name=theme-color]');
  if(mt) mt.setAttribute('content', t==='preto'?'#000000':(t==='light'?'#f1f5f9':'#0e1d38'));
}
function temaAtual(){ try{ return localStorage.getItem('lc_tema')||'dark'; }catch(e){ return 'dark'; } }
function cicloTema(){ const i=TEMAS.indexOf(temaAtual()); aplicarTema(TEMAS[(i+1)%TEMAS.length]); }
function pinTema(){ cicloTema(); }
aplicarTema(temaAtual());

/* ═══ LOGIN POR PIN ═══ */
let lcUserPin='', lcUserLoja='', lcModsPermitidos=null, lcUsuario=null;
let buf='';
function pin(n){ if(buf.length>=4) return; buf+=String(n); dots(); if(buf.length===4) entrar(); }
function pinDel(){ buf=buf.slice(0,-1); dots(); }
function dots(){
  const els=document.querySelectorAll('#dots i');
  for(let i=0;i<els.length;i++) els[i].className=(i<buf.length)?'on':'';
}
async function entrar(){
  const err=document.getElementById('lg-err'); err.textContent='Verificando…';
  try{
    /* 1º procura em lc_usuarios; 2º na equipe da Rotina Comercial (rc_pessoas).
       Assim o mesmo PIN serve para os dois apps. */
    let u=(await dbGetSafe('lc_usuarios','&pin=eq.'+encodeURIComponent(buf))||[])[0];
    if(u && u.ativo===false){ err.textContent='Acesso bloqueado. Fale com o gestor.'; buf=''; dots(); return; }
    if(!u){
      const p=(await dbGetSafe('rc_pessoas','&pin=eq.'+encodeURIComponent(buf))||[])[0];
      if(p){
        const g=lcPapelParaGrupo(p.papel);
        u={ id:'rc'+p.id, nome:p.nome, pin:p.pin, grupo:g, loja:p.loja||'',
            modulos:JSON.stringify(lcModsDoGrupo(g)), ativo:true, origem:'rc' };
      }
    }
    if(!u){ err.textContent='PIN não encontrado.'; buf=''; dots(); return; }
    lcUsuario=u; lcUserPin=u.pin; lcUserLoja=u.loja||'';
    lcModsPermitidos=parseMods(u.modulos);
    try{ sessionStorage.setItem('lc_sess',JSON.stringify(u)); }catch(e){}
    abrirApp();
  }catch(e){ err.textContent='Erro de conexão. Tente de novo.'; buf=''; dots(); }
}
function parseMods(v){
  if(!v) return null;
  if(Array.isArray(v)) return v.length?v:null;
  try{ const p=JSON.parse(v); return (Array.isArray(p)&&p.length)?p:null; }
  catch(e){ const a=String(v).split(',').map(s=>s.trim()).filter(Boolean); return a.length?a:null; }
}
const GRUPO_LBL={gestor:'Gestor',lider:'Líder',consultor:'Consultor',operacional:'Operacional'};
function abrirApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('who').textContent =
    lcUsuario.nome+' · '+(GRUPO_LBL[lcUsuario.grupo]||lcUsuario.grupo)+' · '+(lcUsuario.loja||'Todas as lojas');
  aplicarTema(temaAtual());
  if(lcUsuario.grupo==='operacional') lcRotinaFuncao='operacional';
  else if(lcUsuario.grupo==='consultor') lcRotinaFuncao='consultor';
  else lcRotinaFuncao='lider';
  lcInit();
}
function sair(){ try{ sessionStorage.removeItem('lc_sess'); }catch(e){} location.href=location.pathname; }
</script>

<style>/* ═══ LIDERANÇA COMERCIAL ═══ */

<script>/* ═══════════════════════════════════════════════════════════════════

   Scripts · Captação · Indicações · Ranking · Missões · Lojas · Acessos
   ═══════════════════════════════════════════════════════════════════ */
let lcTab = 'metas';
let lcLojas = [], lcIndic = [], lcMissoes = [], lcChecks = [], lcUsuarios = [];
let lcCfg = null, lcModAtual = null, lcModMenc = {}, lcCaptItens = [];
let lcRcPessoas = [];
let lcMesFiltro = '';

  {nome:'PATTEO', valor_indic:25}, {nome:'RECIFE', valor_indic:30},
  {nome:'SITE', valor_indic:0}, {nome:'P.A LOJA', valor_indic:20},
  {nome:'P.A QUIOSQUE', valor_indic:30}, {nome:'DEPÓSITO', valor_indic:20}
];
const LC_CFG_PADRAO = {
  mencoes:[
    {k:'estoque',    lbl:'Estoque',     txt:'@Renato Estoque Unigames'},
    {k:'financeiro', lbl:'Financeiro 1',txt:'@Naomi Financeiro UNI'},
    {k:'financeiro2',lbl:'Financeiro 2',txt:'@Naomi FINANCEIRO UNIGAMES'},
    {k:'adm',        lbl:'ADM',         txt:'@Adm Unigames'},
    {k:'logistica',  lbl:'Logística',   txt:'@Thierry Adm Uni'},
    {k:'supervisao', lbl:'Supervisão',  txt:'@Vic Supervisora'},
    {k:'gestao',     lbl:'Gestão',      txt:'@Guga Unigames'}
  ],
  faixa10:10, faixa0:0, realme:50, porta:35, aut:35, orc:10
};
const LC_GRUPOS = {
  gestor:      {lbl:'Gestor — acesso total',            mods:['metas','metricas','rotina','scripts','captacao','indicacoes','ranking','missoes','lojas','acessos']},
  lider:       {lbl:'Líder — loja completa',            mods:['metas','metricas','rotina','scripts','captacao','indicacoes','ranking','missoes']},
  consultor:   {lbl:'Consultor — metas e rotina',       mods:['metas','rotina','scripts','captacao','missoes']},
  operacional: {lbl:'Operacional — rotina e captação',  mods:['rotina','captacao','missoes']}
};
const LC_PAPEL_GRUPO = {lider:'lider', líder:'lider', consultor:'consultor', operacional:'operacional', gestor:'gestor'};
function lcPapelParaGrupo(p){ return LC_PAPEL_GRUPO[String(p||'').toLowerCase().trim()] || 'consultor'; }
function lcModsDoGrupo(g){ return (LC_GRUPOS[g]||LC_GRUPOS.consultor).mods.slice(); }
const LC_MODS_LBL = {metas:'Metas',metricas:'Métricas',rotina:'Rotina',scripts:'Scripts',captacao:'Captação',indicacoes:'Indicações',ranking:'Ranking',missoes:'Missões',lojas:'Lojas',acessos:'Acessos'};

/* ── utilidades ─────────────────────────────────────────────────────── */
function lcHoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lcMes(){ return lcHoje().slice(0,7); }
function lcDataBR(iso){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso; }
function lcUp(s){ return String(s==null?'':s).toUpperCase().trim(); }
function lcNum(v){ if(v==null) return 0; const s=String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; }
function lcBRL(n){ return 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function lcEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function lcVal(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function lcNomesLojas(){ return (lcLojas.length?lcLojas:LC_LOJAS_PADRAO).map(l=>l.nome); }
function lcOptsLoja(sel,semSite){
  return lcNomesLojas().filter(n=>!(semSite&&(n==='SITE'||n==='DEPÓSITO')))
    .map(n=>'<option'+(n===sel?' selected':'')+'>'+lcEsc(n)+'</option>').join('');
}
function lcToast(msg,tipo){
  let t=document.getElementById('lc-toast');
  if(!t){ t=document.createElement('div'); t.id='lc-toast'; document.body.appendChild(t); }
  t.className='lc-toast'+(tipo==='err'?' err':'')+' on'; t.textContent=msg;
  clearTimeout(t._x); t._x=setTimeout(()=>{ t.classList.remove('on'); },2000);
}
function lcCopiar(id){
  const el=document.getElementById(id); if(!el) return;
  const txt=el.textContent||el.value||'';
  const done=()=>lcToast('Copiado ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>lcCopiaFallback(txt));
  else lcCopiaFallback(txt);
}
function lcCopiaFallback(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); lcToast('Copiado ✓'); }catch(e){ lcToast('Copie manualmente','err'); }
  document.body.removeChild(ta);
}
function lcMenc(k){ const a=(lcCfg&&lcCfg.mencoes)||[]; for(let i=0;i<a.length;i++) if(a[i].k===k) return a[i].txt; return ''; }

/* ── carga de dados ─────────────────────────────────────────────────── */
async function lcInit(){
  if(!lcMesFiltro) lcMesFiltro = lcMes();
  const body=document.getElementById('lc-body');
  if(body && !body.innerHTML) body.innerHTML='<div class="lc-empty">Carregando módulo de liderança…</div>';
  try{ lcLojas = await dbGetSafe('lc_lojas','&order=nome.asc'); }catch(e){ lcLojas=[]; }
  if(!Array.isArray(lcLojas)) lcLojas=[];
  try{
    const rows = await dbGetSafe('lc_config','&chave=eq.geral');
    lcCfg = (rows&&rows[0]&&rows[0].valor) ? (typeof rows[0].valor==='string'?JSON.parse(rows[0].valor):rows[0].valor) : null;
    lcCfg = Object.assign({}, LC_CFG_PADRAO, lcCfg||{});
    if(!Array.isArray(lcCfg.mencoes)||!lcCfg.mencoes.length) lcCfg.mencoes=LC_CFG_PADRAO.mencoes.slice();
  }catch(e){ lcCfg=JSON.parse(JSON.stringify(LC_CFG_PADRAO)); }
  await lcCarregarIndic();
  await lcCarregarMissoes();
  await lcCarregarMetas();
  await lcCarregarRotina();
  lcMxCarregar();
  lcMxCred();
  try{ lcUsuarios = await dbGetSafe('lc_usuarios','&order=nome.asc'); }catch(e){ lcUsuarios=[]; }
  if(!Array.isArray(lcUsuarios)) lcUsuarios=[];
  try{ lcRcPessoas = await dbGetSafe('rc_pessoas'); }catch(e){ lcRcPessoas=[]; }
  if(!Array.isArray(lcRcPessoas)) lcRcPessoas=[];
  lcRender();
}
async function lcCarregarIndic(){
  const ini=lcMesFiltro+'-01';
  const [a,m]=lcMesFiltro.split('-').map(Number);
  const fim=new Date(a,m,0);
  const fimISO=lcMesFiltro+'-'+String(fim.getDate()).padStart(2,'0');
  try{ lcIndic = await dbGetSafe('lc_indicacoes','&data=gte.'+ini+'&data=lte.'+fimISO); }catch(e){ lcIndic=[]; }
  if(!Array.isArray(lcIndic)) lcIndic=[];
}
async function lcCarregarMissoes(){
  try{ lcMissoes = await dbGetSafe('lc_missoes','&ativo=is.true'); }catch(e){ lcMissoes=[]; }
  if(!Array.isArray(lcMissoes)) lcMissoes=[];
  try{ lcChecks = await dbGetSafe('lc_missao_checks','&data=eq.'+lcHoje()); }catch(e){ lcChecks=[]; }
  if(!Array.isArray(lcChecks)) lcChecks=[];
}
async function lcSalvarCfg(){
  try{
    const rows = await dbGetSafe('lc_config','&chave=eq.geral');
    if(rows&&rows[0]) await dbUpdate('lc_config',rows[0].id,{valor:JSON.stringify(lcCfg)});
    else await dbInsert('lc_config',{chave:'geral',valor:JSON.stringify(lcCfg)});
    lcToast('Configuração salva ✓');
  }catch(e){ lcToast('Erro ao salvar config','err'); }
}

/* ── navegação interna ──────────────────────────────────────────────── */
function lcGo(t){ lcTab=t; lcRender(); const b=document.getElementById('lc-body'); if(b) b.scrollIntoView({behavior:'smooth',block:'start'}); }
function lcRender(){
  const bar=document.getElementById('lc-topbar'); const body=document.getElementById('lc-body');
  if(!bar||!body) return;
  const abas=[['metas','📊','Metas'],['metricas','📈','Métricas'],['rotina','🔁','Rotina'],['scripts','🧾','Scripts'],['captacao','📦','Captação'],
              ['indicacoes','🎁','Indicações'],['ranking','🏆','Ranking'],['missoes','🎯','Missões'],
              ['lojas','🏬','Lojas'],['acessos','🔐','Acessos']];
  const perm = (typeof lcModsPermitidos!=='undefined' && lcModsPermitidos) ? lcModsPermitidos : null;
  const vis = abas.filter(a=>!perm || perm.indexOf(a[0])>=0);
  if(vis.length && !vis.some(a=>a[0]===lcTab)) lcTab=vis[0][0];
  bar.innerHTML = vis.map(a=>'<button class="lc-tab'+(lcTab===a[0]?' on':'')+'" onclick="lcGo(\''+a[0]+'\')">'+a[1]+' '+a[2]+'</button>').join('');
  if(lcTab==='metas')      lcRenderMetas();
  else if(lcTab==='metricas') lcRenderMetricas();
  else if(lcTab==='rotina') lcRenderRotina();
  else if(lcTab==='scripts')    lcRenderScripts();
  else if(lcTab==='captacao')   lcRenderCaptacao();
  else if(lcTab==='indicacoes') lcRenderIndic();
  else if(lcTab==='ranking')    lcRenderRank();
  else if(lcTab==='missoes')    lcRenderMissoes();
  else if(lcTab==='lojas')      lcRenderLojas();
  else if(lcTab==='acessos')    lcRenderAcessos();
}

function lcRenderScripts(){
  const body=document.getElementById('lc-body');
  let cards='', g='';
  LC_MOD.forEach(m=>{
    if(m.g!==g){ if(g) cards+='</div>'; cards+='<div class="lc-grp">'+lcEsc(m.g)+'</div><div class="lc-mods">'; g=m.g; }
    cards+='<button class="lc-mod'+(lcModAtual&&lcModAtual.id===m.id?' on':'')+'" onclick="lcPickMod(\''+m.id+'\')">'
         + '<span class="ic">'+m.ic+'</span><span class="tt">'+lcEsc(m.t)+'</span>'
         + (m.sub?'<span class="sb">'+lcEsc(m.sub)+'</span>':'')+'</button>';
  });
  cards+='</div>';
  body.innerHTML =
    '<div class="lc-card"><div class="lc-h">Modelo de script</div>'+cards+'</div>'
  + '<div id="lc-form-wrap"></div>';
  if(lcModAtual) lcRenderFormScript();
}
function lcPickMod(id){
  lcModAtual = LC_MOD.find(m=>m.id===id) || null;
  lcModMenc = {};
  (lcModAtual.m||[]).forEach(k=>{ lcModMenc[k]=true; });
  lcRenderScripts();
  setTimeout(()=>{ const w=document.getElementById('lc-form-wrap'); if(w) w.scrollIntoView({behavior:'smooth',block:'start'}); },60);
}
function lcRenderFormScript(){
  const m=lcModAtual; if(!m) return;
  let h='<div class="lc-card"><div class="lc-h">'+m.ic+' '+lcEsc(m.t)+'</div>', pend='';
  m.f.forEach(f=>{
    let fh='';
    if(f.tp==='loja'){
      fh='<div class="lc-f"><label>'+lcEsc(f.l)+'</label><select id="lcx_'+f.k+'">'+lcOptsLoja(f.v||lcNomesLojas()[0])+'</select></div>';
    } else if(f.tp==='dataBR'){
      const h2=lcDataBR(lcHoje()); const curta=h2.slice(0,6)+h2.slice(8);
      fh='<div class="lc-f"><label>'+lcEsc(f.l)+'</label><input id="lcx_'+f.k+'" value="'+curta+'"></div>';
    } else {
      let dl='', dlid='';
      if(f.sug){ dlid='lcdl_'+m.id+'_'+f.k; dl='<datalist id="'+dlid+'">'+f.sug.map(s=>'<option value="'+lcEsc(s)+'">').join('')+'</datalist>'; }
      fh='<div class="lc-f"><label>'+lcEsc(f.l)+'</label><input id="lcx_'+f.k+'" '+(dlid?'list="'+dlid+'"':'')+' value="'+lcEsc(f.v||'')+'" oninput="lcPreview()">'+dl+'</div>';
    }
    if(f.w==='half'){ if(pend){ h+='<div class="lc-g2">'+pend+fh+'</div>'; pend=''; } else pend=fh; }
    else { if(pend){ h+=pend; pend=''; } h+=fh; }
  });
  if(pend) h+=pend;
  const lista=(lcCfg&&lcCfg.mencoes)||[];
  if(lista.length){
    const dflt=(m.m||[]).concat(m.mx||[]);
    const ord=lista.slice().sort((a,b)=>{ let pa=dflt.indexOf(a.k), pb=dflt.indexOf(b.k); if(pa<0)pa=99; if(pb<0)pb=99; return pa-pb; });
    h+='<label class="lc-lb">Menções</label><div class="lc-chips">'
     + ord.map(x=>'<span class="lc-chip'+(lcModMenc[x.k]?' on':'')+'" onclick="lcTglMenc(\''+x.k+'\')">'+lcEsc(x.txt)+'</span>').join('')
     + '</div><p class="lc-hint">Toque para ligar/desligar. Cadastre novas pessoas na aba 🏬 Lojas › Menções.</p>';
  }
  h+='<button class="lc-btn" onclick="lcPreview(1)">⚡ Gerar script</button></div>'
   + '<div class="lc-card" id="lc-out-card" style="display:none"><div class="lc-h">Pronto para enviar</div>'
   + '<pre class="lc-out" id="lc-out"></pre>'
   + '<div class="lc-g2"><button class="lc-btn ok" onclick="lcCopiar(\'lc-out\')">📋 Copiar</button>'
   + '<button class="lc-btn2" onclick="lcRenderScripts()">🧹 Limpar</button></div></div>';
  document.getElementById('lc-form-wrap').innerHTML=h;
  lcPreview();
}
function lcTglMenc(k){ lcModMenc[k]=!lcModMenc[k]; lcRenderFormScript(); }
function lcMencAtivas(){
  const out=[]; ((lcCfg&&lcCfg.mencoes)||[]).forEach(x=>{ if(lcModMenc[x.k]&&x.txt) out.push(x.txt); });
  return out;
}
function lcPreview(forcar){
  const m=lcModAtual; if(!m) return;
  const card=document.getElementById('lc-out-card'); if(!card) return;
  const d={}; let falta=false;
  m.f.forEach(f=>{
    let v=lcVal('lcx_'+f.k);
    if(f.tp!=='dataBR' && f.k!=='pix') v=lcUp(v);
    d[f.k]=v; if(!f.op && !v) falta=true;
  });
  if(falta && !forcar){ card.style.display='none'; return; }
  if(falta && forcar) lcToast('Preencha os campos obrigatórios','err');
  document.getElementById('lc-out').textContent = m.gen(d, lcMencAtivas()).join('\n');
  card.style.display='';
  if(forcar) setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),60);
}

function lcCaptScript(){
  const loja=lcVal('lcc_loja'), fin=lcVal('lcc_modo')==='fin';
  const lin=['CAPTAÇÃO '+lcUp(loja)];
  lcCaptItens.forEach(it=>{
    if(!it.prod) return;
    lin.push(lcUp(it.qtd||'01')+' - '+lcUp(it.prod));
    lin.push('SN: '+(it.sn?lcUp(it.sn):'SEM SERIAL'));
    if(it.df) lin.push('DF: '+lcUp(it.df));
  });
  const st=lcVal('lcc_status'); if(st) lin.push(lcUp(st));
  let me;
  if(fin){
    const nome=lcVal('lcc_nome'), cpf=lcVal('lcc_cpf'), n=lcVal('lcc_num'),
          pix=lcVal('lcc_pix'), bco=lcVal('lcc_banco'), val=lcVal('lcc_valor');
    lin.push('NOME: '+lcUp(nome));
    if(cpf) lin.push('CPF: '+cpf);
    lin.push('NÚMERO: '+n);
    lin.push('CHAVE PIX: '+pix);
    lin.push('BANCO: '+lcUp(bco));
    lin.push('VALOR: '+lcBRL(lcNum(val)));
    me=[lcMenc('financeiro'),lcMenc('financeiro2'),lcMenc('adm')];
  } else {
    me=[lcMenc('supervisao'),lcMenc('gestao'),lcMenc('estoque')];
  }
  return lin.concat(me.filter(Boolean)).join('\n');
}

  out.textContent=lcCaptScript(); out.style.display=''; acts.style.display='';
  if(forcar) setTimeout(()=>out.scrollIntoView({behavior:'smooth',block:'center'}),60);
}

function lcValorLoja(nome){
  const l=(lcLojas.length?lcLojas:LC_LOJAS_PADRAO).find(x=>x.nome===nome);
  return l?Number(l.valor_indic)||0:20;
}
function lcRegraValor(loja,vprod,tipo){
  if(tipo==='realme')     return Number(lcCfg.realme)||50;
  if(tipo==='porta')      return Number(lcCfg.porta)||35;
  if(tipo==='assist_aut') return Number(lcCfg.aut)||35;
  if(tipo==='assist_orc') return Number(lcCfg.orc)||10;
  if(vprod>=1000) return lcValorLoja(loja)||20;
  if(vprod>=200)  return Number(lcCfg.faixa10)||10;
  return Number(lcCfg.faixa0)||0;
}
function lcExplicar(loja,vprod,tipo,base,isSite){
  if(tipo==='realme')     return 'Campanha Realme/Xiaomi — '+lcBRL(base)+' fixo.';
  if(tipo==='porta')      return 'Campanha Trazer na Porta — '+lcBRL(base)+' pelo item convertido.';
  if(tipo==='assist_aut') return 'Assistência autorizada — '+lcBRL(base)+'.';
  if(tipo==='assist_orc') return 'Assistência orçamento — '+lcBRL(base)+'.';
  if(vprod>=1000) return loja+' · venda ≥ R$1.000 = '+lcBRL(base)+'.'+(isSite?' (regra da loja de conversão)':'');
  if(vprod>=200)  return 'Venda entre R$200 e R$999 = '+lcBRL(base)+'.';
  return 'Venda abaixo de R$200 — sem comissão padrão (conta para a campanha Itens).';
}

  const pago = pagoEl.value.trim()==='' ? base : lcNum(pagoEl.value);
  pagoEl.placeholder=String(base).replace('.',',');
  const gd=Math.max(0,pago-base);
  const dup=document.getElementById('lci_dupla');
  const dupla=(dup&&dup.checked)?lcNum(lcVal('lci_vpago2')):0;
  document.getElementById('lci_cregra').textContent=lcBRL(base);
  document.getElementById('lci_cpago').textContent=lcBRL(pago+dupla);
  document.getElementById('lci_cgd').textContent=lcBRL(gd+dupla);
  let exp=lcExplicar(loja,vprod,tipo,base,lojaReal==='SITE');
  if(dupla>0) exp+=' 2º indicador ('+lcBRL(dupla)+') sai 100% da gordura.';
  document.getElementById('lci_cexp').textContent=exp;
  return {base,pago,gd,dupla,tipo,vprod,loja:lojaReal,conv:(lojaReal==='SITE'?lcVal('lci_conv'):'')};
}
function lcScriptPix(r){
  const a=['INDICAÇÃO','ID: '+r.id_venda,'LOJA: '+r.loja];
  if(r.conv) a.push('CONVERSÃO: '+r.conv);
  a.push('NOME: '+lcUp(r.nome),'PIX: '+r.pix,'VALOR: '+lcBRL(r.pago));
  const obs=[];
  if(Number(r.gd)>0) obs.push('ADICIONAR '+lcBRL(r.gd).replace('R$ ','R$')+' A PLANILHA DE GD');
  if(r.item) obs.push('ADICIONAR ITEM INDICAÇÃO NA VENDA');
  if(r.obs) obs.push(lcUp(r.obs));
  obs.forEach((o,i)=>{ a.push((obs.length>1?('OBS'+(i+1)):'OBS')+': '+o+(o.slice(-1)==='.'?'':'.')); });
  return a.join('\n');
}
async function lcIndicSalvar(){
  const id=lcVal('lci_id'), nome=lcVal('lci_nome'), pix=lcVal('lci_pix');
  if(!id||!nome||!pix){ lcToast('Informe ID, indicador e PIX','err'); return; }
  const c=lcIndicCalc();
  const data=lcVal('lci_data')||lcHoje();
  const reg={ id_venda:id, data, loja:c.loja, conv:c.conv||null, nome, pix, tipo:c.tipo,
              vprod:c.vprod, pago:c.pago, base:c.base, gd:c.gd,
              item:!!document.getElementById('lci_item').checked, obs:lcVal('lci_obs')||null, status:'PAGO' };
  let txt='';
  try{
    const ins=await dbInsert('lc_indicacoes',reg);
    const saved=(Array.isArray(ins)?ins[0]:ins)||reg;
    lcIndic.unshift(saved); txt=lcScriptPix(saved);
    const dup=document.getElementById('lci_dupla');
    if(dup&&dup.checked){
      const n2=lcVal('lci_nome2'), p2=lcVal('lci_pix2'), v2=lcNum(lcVal('lci_vpago2'));
      if(n2&&p2&&v2>0){
        const r2={ id_venda:id, data, loja:c.loja, conv:c.conv||null, nome:n2, pix:p2, tipo:c.tipo,
                   vprod:c.vprod, pago:v2, base:0, gd:v2, item:false, obs:'INDICAÇÃO DUPLA', status:'PAGO' };
        const i2=await dbInsert('lc_indicacoes',r2);
        const s2=(Array.isArray(i2)?i2[0]:i2)||r2;
        lcIndic.unshift(s2); txt+='\n\n'+lcScriptPix(s2);
      }
    }
    lcToast('Indicação salva ✓');
  }catch(e){ lcToast('Erro ao salvar: '+e.message,'err'); return; }
  document.getElementById('lci-out').textContent=txt;
  document.getElementById('lci-outcard').style.display='';
  ['lci_id','lci_nome','lci_pix','lci_vprod','lci_vpago','lci_obs','lci_nome2','lci_pix2','lci_vpago2']
    .forEach(k=>{ const e=document.getElementById(k); if(e) e.value=''; });
  document.getElementById('lci_item').checked=false;
  document.getElementById('lci_dupla').checked=false; lcIndicToggleDupla();
  lcIndicLista();
  setTimeout(()=>document.getElementById('lci-outcard').scrollIntoView({behavior:'smooth',block:'center'}),80);
}

async function lcIndicDel(id){
  if(!confirm('Excluir este lançamento de indicação?')) return;

function lcExportCSV(){
  if(!lcIndic.length){ lcToast('Nada para exportar','err'); return; }
  const head=['ID DE VENDA','DATA','VALOR DE INDICAÇÃO','TIPO','VALOR DO PRODUTO','INDICADOR','CHAVE PIX','STATUS','REALME','LOJA','CONVERSÃO','GORDURA','OBS'];
  const ord=lcIndic.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  const linhas=[head.join(';')].concat(ord.map(r=>[
    r.id_venda, lcDataBR(r.data), lcBRL(r.pago), (LC_TIPOS[r.tipo]||r.tipo), lcBRL(r.vprod),
    lcUp(r.nome), r.pix, r.status||'PAGO', (r.tipo==='realme'?'1':''), r.loja, r.conv||'',
    (Number(r.gd)>0?lcBRL(r.gd):''), r.obs||''
  ].join(';')));
  const blob=new Blob(['\ufeff'+linhas.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='indicacoes_'+lcMesFiltro+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  lcToast('CSV gerado ✓');
}

/* ═══ 4. RANKING ═══════════════════════════════════════════════════════ */
const LC_SEM=['01 a 07','08 a 14','15 a 21','22 ao fim'];
function lcSemana(iso){ const d=parseInt(String(iso).slice(8,10),10); return d<=7?0:(d<=14?1:(d<=21?2:3)); }
function lcTabRank(mapa,campo){
  const arr=Object.keys(mapa).map(k=>({n:k,v:mapa[k]})).sort((a,b)=>b.v-a.v);
  if(!arr.length) return '<div class="lc-empty">Sem dados.</div>';
  return '<div class="table-wrap"><table><thead><tr><th style="width:52px">#</th><th>Indicador</th><th style="text-align:right">'+campo+'</th></tr></thead><tbody>'
   + arr.map((x,i)=>'<tr><td>'+(i===0?'<b style="color:#fbbf24">1º 🥇</b>':(i+1)+'º')+'</td><td>'+lcEsc(x.n)+'</td><td style="text-align:right"><b>'+x.v+'</b></td></tr>').join('')
   + '</tbody></table></div>';
}
function lcRenderRank(){
  const body=document.getElementById('lc-body');
  let qtd=lcIndic.length, pago=0, gd=0;
  lcIndic.forEach(r=>{ pago+=Number(r.pago)||0; gd+=Number(r.gd)||0; });
  const sem=[{},{},{},{}], semR=[{},{},{},{}], itens={}, mensal={}, lojas={};
  lcIndic.forEach(r=>{
    const s=lcSemana(r.data), n=r.nome||'—';
    sem[s][n]=(sem[s][n]||0)+1;
    if(r.tipo==='realme') semR[s][n]=(semR[s][n]||0)+1;
    const vp=Number(r.vprod)||0;
    if(vp>0&&vp<200) itens[n]=(itens[n]||0)+1;
    if(!mensal[n]) mensal[n]={q:0,v:0};
    mensal[n].q++; mensal[n].v+=Number(r.pago)||0;
    const lj=r.conv?(r.loja+' › '+r.conv):r.loja;
    if(!lojas[lj]) lojas[lj]={q:0,v:0,gd:0};
    lojas[lj].q++; lojas[lj].v+=Number(r.pago)||0; lojas[lj].gd+=Number(r.gd)||0;
  });
  const ma=Object.keys(mensal).map(k=>({n:k,q:mensal[k].q,v:mensal[k].v})).sort((a,b)=>b.q-a.q||b.v-a.v);
  const la=Object.keys(lojas).map(k=>({n:k,q:lojas[k].q,v:lojas[k].v,gd:lojas[k].gd})).sort((a,b)=>b.v-a.v);
  let tq=0,tv=0,tg=0; la.forEach(x=>{ tq+=x.q; tv+=x.v; tg+=x.gd; });
  body.innerHTML =
   '<div class="lc-card"><div class="lc-g2"><div class="lc-f"><label>Mês</label>'
  +'<input type="month" value="'+lcMesFiltro+'" onchange="lcTrocarMes(this.value)"></div><div></div></div>'
  +'<div class="lc-kpis"><div class="lc-kpi"><b>'+qtd+'</b><small>Indicações</small></div>'
  +'<div class="lc-kpi"><b>'+lcBRL(pago)+'</b><small>Pago em PIX</small></div>'
  +'<div class="lc-kpi gd"><b>'+lcBRL(gd)+'</b><small>Gordura usada</small></div></div></div>'
  +'<div class="lc-card"><div class="lc-h">🏆 Campanha Indica — semanal (R$100)</div>'
  + LC_SEM.map((s,i)=>'<div class="lc-grp">'+s+'</div>'+lcTabRank(sem[i],'Pontos')).join('')+'</div>'
  +'<div class="lc-card"><div class="lc-h">🔥 Campanha Realme/Xiaomi — semanal (R$100)</div>'
  + LC_SEM.map((s,i)=>'<div class="lc-grp">'+s+'</div>'+lcTabRank(semR[i],'Realmes')).join('')+'</div>'
  +'<div class="lc-card"><div class="lc-h">⭐ Campanha Itens — mensal (R$50)</div>'
  +'<p class="lc-hint">Produtos abaixo de R$200,00.</p>'+lcTabRank(itens,'Itens')+'</div>'
  +'<div class="lc-card"><div class="lc-h">📊 Consolidado mensal</div>'
  +(ma.length?('<div class="table-wrap"><table><thead><tr><th style="width:52px">#</th><th>Indicador</th><th style="text-align:center">Ind.</th><th style="text-align:right">Recebido</th></tr></thead><tbody>'
  + ma.map((x,i)=>'<tr><td>'+(i===0?'<b style="color:#fbbf24">1º</b>':(i+1)+'º')+'</td><td>'+lcEsc(x.n)+'</td><td style="text-align:center">'+x.q+'</td><td style="text-align:right"><b>'+lcBRL(x.v)+'</b></td></tr>').join('')
  +'</tbody></table></div>'):'<div class="lc-empty">Sem dados.</div>')+'</div>'
  +'<div class="lc-card"><div class="lc-h">🏬 Fechamento por loja</div>'
  +(la.length?('<div class="table-wrap"><table><thead><tr><th>Loja</th><th style="text-align:center">Qtd</th><th style="text-align:right">Total</th><th style="text-align:right">GD</th></tr></thead><tbody>'
  + la.map(x=>'<tr><td>'+lcEsc(x.n)+'</td><td style="text-align:center">'+x.q+'</td><td style="text-align:right">'+lcBRL(x.v)+'</td><td style="text-align:right;color:#fb923c">'+lcBRL(x.gd)+'</td></tr>').join('')
  +'<tr><td><b>TOTAL</b></td><td style="text-align:center"><b>'+tq+'</b></td><td style="text-align:right"><b>'+lcBRL(tv)+'</b></td><td style="text-align:right;color:#fb923c"><b>'+lcBRL(tg)+'</b></td></tr>'
  +'</tbody></table></div>'):'<div class="lc-empty">Sem dados.</div>')+'</div>';
}

/* ═══ 5. MISSÕES ═══════════════════════════════════════════════════════ */
const LC_PRIOS={alta:{lbl:'ALTA',cor:'#f87171'},media:{lbl:'MÉDIA',cor:'#fbbf24'},baixa:{lbl:'BAIXA',cor:'#60a5fa'}};
const LC_REPS={nao:'Não repetir',diaria:'Diária',semanal:'Semanal',mensal:'Mensal'};

function lcMissaoDoDia(m,iso){
  const rep=m.repeticao||'nao';
  if(rep==='nao') return String(m.data||'').slice(0,10)===iso;
  const base=new Date(String(m.data||m.criado_em||iso).slice(0,10)+'T12:00:00');
  const alvo=new Date(iso+'T12:00:00');
  if(alvo<base) return false;
  if(rep==='diaria')  return true;
  if(rep==='semanal') return base.getDay()===alvo.getDay();
  if(rep==='mensal')  return base.getDate()===alvo.getDate();
  return false;
}
function lcCheckDe(missaoId){ return lcChecks.find(c=>String(c.missao_id)===String(missaoId)&&c.data===lcHoje()); }
function lcRenderMissoes(){
  const body=document.getElementById('lc-body');
  const hoje=lcHoje();
  const doDia=lcMissoes.filter(m=>lcMissaoDoDia(m,hoje))
    .sort((a,b)=>String(a.horario||'99:99').localeCompare(String(b.horario||'99:99')));
  const feitas=doDia.filter(m=>{ const c=lcCheckDe(m.id); return c&&c.feito; }).length;
  const pct=doDia.length?Math.round(feitas/doDia.length*100):0;
  const resp={}; doDia.forEach(m=>{ const r=m.responsavel||'Geral'; (resp[r]=resp[r]||[]).push(m); });
  let listas='';
  Object.keys(resp).sort().forEach(r=>{
    listas+='<div class="lc-grp">'+lcEsc(r)+'</div>'+resp[r].map(m=>{
      const c=lcCheckDe(m.id), ok=c&&c.feito;
      const p=LC_PRIOS[m.prioridade||'media']||LC_PRIOS.media;
      return '<div class="lc-miss'+(ok?' ok':'')+'">'
       +'<input type="checkbox" '+(ok?'checked':'')+' onchange="lcMissaoToggle('+m.id+')">'
       +'<div class="lc-miss-body"><div class="lc-miss-t">'+(m.horario?'<span class="lc-hr">'+lcEsc(m.horario)+'</span> ':'')+lcEsc(m.titulo)+'</div>'
       +'<div class="lc-row-mt"><span class="lc-bg" style="background:'+p.cor+'22;color:'+p.cor+'">'+p.lbl+'</span> '
       +(m.repeticao&&m.repeticao!=='nao'?'<span class="lc-bg mut">↻ '+LC_REPS[m.repeticao]+'</span> ':'')
       +(m.loja?'<span class="lc-bg mut">'+lcEsc(m.loja)+'</span>':'')+'</div></div>'
       +'<button class="lc-del" onclick="lcMissaoDel('+m.id+')">✕</button></div>';
    }).join('');
  });
  body.innerHTML =
   '<div class="lc-card"><div class="lc-h">🎯 Missões de hoje — '+lcDataBR(hoje)+'</div>'
  +'<div class="lc-prog"><div class="lc-prog-bar"><i style="width:'+pct+'%"></i></div>'
  +'<span>'+feitas+' de '+doDia.length+' concluídas · '+pct+'%</span></div>'
  +(doDia.length?listas:'<div class="lc-empty">Nenhuma missão para hoje.</div>')
  +'<button class="lc-btn2" style="margin-top:10px" onclick="lcMissoesScript()">📋 Gerar lista para o grupo</button>'
  +'<pre class="lc-out" id="lcm-out" style="display:none;margin-top:10px"></pre></div>'
  +'<div class="lc-card"><div class="lc-h">+ Nova missão</div>'
  +'<div class="lc-g2">'
  +'<div class="lc-f"><label>Horário (opcional)</label><input id="lcm_hora" type="time"></div>'
  +'<div class="lc-f"><label>Prioridade</label><select id="lcm_prio"><option value="alta">ALTA</option><option value="media" selected>MÉDIA</option><option value="baixa">BAIXA</option></select></div>'
  +'</div>'
  +'<div class="lc-f"><label>Atividade</label><input id="lcm_tit" placeholder="Ex.: Conferir divergências da loja Recife"></div>'
  +'<div class="lc-g2">'
  +'<div class="lc-f"><label>Repetição</label><select id="lcm_rep">'
  + Object.keys(LC_REPS).map(k=>'<option value="'+k+'">'+LC_REPS[k]+'</option>').join('')+'</select></div>'
  +'<div class="lc-f"><label>Loja</label><select id="lcm_loja"><option value="">Todas</option>'+lcOptsLoja('')+'</select></div>'
  +'</div>'
  +'<div class="lc-f"><label>Responsável</label><input id="lcm_resp" list="lcdl_resp" placeholder="Vazio = minha agenda">'
  +'<datalist id="lcdl_resp">'+lcUsuarios.map(u=>'<option value="'+lcEsc(u.nome)+'">').join('')+'</datalist></div>'
  +'<button class="lc-btn" onclick="lcMissaoSalvar()">+ Adicionar missão</button></div>'
  +'<div class="lc-card"><div class="lc-h">Todas as missões cadastradas</div>'
  +(lcMissoes.length?('<div class="table-wrap"><table><thead><tr><th>Atividade</th><th>Prior.</th><th>Repet.</th><th>Resp.</th><th></th></tr></thead><tbody>'
  + lcMissoes.map(m=>'<tr><td>'+(m.horario?'<b>'+lcEsc(m.horario)+'</b> ':'')+lcEsc(m.titulo)+'</td>'
  +'<td>'+((LC_PRIOS[m.prioridade||'media']||LC_PRIOS.media).lbl)+'</td><td>'+(LC_REPS[m.repeticao||'nao'])+'</td>'
  +'<td>'+lcEsc(m.responsavel||'—')+'</td><td><button class="lc-del" onclick="lcMissaoDel('+m.id+')">✕</button></td></tr>').join('')
  +'</tbody></table></div>'):'<div class="lc-empty">Nenhuma missão cadastrada.</div>')+'</div>';
}
async function lcMissaoSalvar(){
  const tit=lcVal('lcm_tit');
  if(!tit){ lcToast('Informe a atividade','err'); return; }
  const reg={ titulo:lcUp(tit), horario:lcVal('lcm_hora')||null, prioridade:lcVal('lcm_prio')||'media',
              repeticao:lcVal('lcm_rep')||'nao', loja:lcVal('lcm_loja')||null,
              responsavel:lcVal('lcm_resp')||null, data:lcHoje(), ativo:true };
  try{
    const ins=await dbInsert('lc_missoes',reg);
    const saved=(Array.isArray(ins)?ins[0]:ins)||reg;
    lcMissoes.unshift(saved); lcToast('Missão criada ✓'); lcRenderMissoes();
  }catch(e){ lcToast('Erro ao salvar missão','err'); }
}
async function lcMissaoToggle(id){
  const c=lcCheckDe(id);
  try{
    if(c){ const novo=!c.feito; await dbUpdate('lc_missao_checks',c.id,{feito:novo}); c.feito=novo; }
    else{
      const reg={missao_id:id,data:lcHoje(),feito:true};
      const ins=await dbInsert('lc_missao_checks',reg);
      lcChecks.push((Array.isArray(ins)?ins[0]:ins)||reg);
    }
  }catch(e){
    if(c) c.feito=!c.feito; else lcChecks.push({id:'tmp'+Date.now(),missao_id:id,data:lcHoje(),feito:true});
  }
  lcRenderMissoes();
}
async function lcMissaoDel(id){
  if(!confirm('Remover esta missão?')) return;
  try{ await dbUpdate('lc_missoes',id,{ativo:false}); }catch(e){ lcToast('Erro ao remover','err'); return; }
  lcMissoes=lcMissoes.filter(m=>String(m.id)!==String(id));
  lcRenderMissoes(); lcToast('Removida');
}
function lcMissoesScript(){
  const hoje=lcHoje();
  const doDia=lcMissoes.filter(m=>lcMissaoDoDia(m,hoje))
    .sort((a,b)=>String(a.horario||'99:99').localeCompare(String(b.horario||'99:99')));
  if(!doDia.length){ lcToast('Nenhuma missão hoje','err'); return; }
  const lin=['MISSÕES — '+lcDataBR(hoje),''];
  doDia.forEach(m=>{
    const c=lcCheckDe(m.id), ok=c&&c.feito;
    const p=(LC_PRIOS[m.prioridade||'media']||LC_PRIOS.media).lbl;
    lin.push((ok?'✅ ':'⬜ ')+(m.horario?m.horario+' · ':'')+lcUp(m.titulo)+' ['+p+']');
  });
  const el=document.getElementById('lcm-out');
  el.textContent=lin.join('\n'); el.style.display='';
  lcCopiar('lcm-out');
}

const LC_GG_SHEET='1Pgsj3e9B4UVcqtIIVXXGPptGiYW_9VLLhWz54--rwtg';
const LC_GG_GIDS={lojas:'1637953054', vendedores:'1756092591', nbpc:'1891368776'};
let lcGG={lojas:[],vend:[],cob:[],fds:[],ts:0,erro:''};
let lcMetas=[];

function lcGGUrl(gid){ return 'https://docs.google.com/spreadsheets/d/'+LC_GG_SHEET+'/export?format=csv&gid='+gid; }
function lcCsvRows(csv){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<csv.length;i++){
    const c=csv[i],n=csv[i+1];
    if(c==='"'&&q&&n==='"'){cur+='"';i++;continue;}
    if(c==='"'){q=!q;continue;}
    if(c===','&&!q){row.push(cur);cur='';continue;}
    if((c==='\n'||c==='\r')&&!q){ if(c==='\r'&&n==='\n')i++; row.push(cur);
      if(row.some(x=>String(x).trim()!=='')) rows.push(row); row=[];cur=''; continue;}
    cur+=c;
  }
  row.push(cur); if(row.some(x=>String(x).trim()!=='')) rows.push(row);
  return rows;
}
function lcNH(t){ return String(t||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' '); }
function lcMoney(v){ if(v==null) return 0; const s=String(v).replace(/R\$/g,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''); return parseFloat(s)||0; }
function lcPctBR(v){ if(v==null) return 0; const s=String(v).replace('%','').replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''); return parseFloat(s)||0; }
function lcNumBR(v){ if(v==null) return 0; const s=String(v).replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''); return parseFloat(s)||0; }
function lcRowsObj(rows,hi,si){
  const hs=(rows[hi]||[]).map(lcNH);
  return rows.slice(si).map(r=>{const o={}; hs.forEach((h,i)=>{ if(h) o[h]=String(r[i]||'').trim(); }); return o;})
    .filter(o=>Object.values(o).some(v=>String(v).trim()!==''));
}
function lcRowsAuto(rows,req){
  const rq=(req||[]).map(lcNH); let best=0,sc=-1;
  rows.slice(0,8).forEach((row,idx)=>{
    const h=row.map(lcNH).join(' | ');
    const s=rq.reduce((a,r)=>a+(h.indexOf(r)>=0?1:0),0);
    if(s>sc){sc=s;best=idx;}
  });
  return lcRowsObj(rows,best,best+1);
}
function lcFld(obj,aliases,opts){
  opts=opts||{};
  const na=[].concat(aliases).map(lcNH);
  for(const a of na){ if(Object.prototype.hasOwnProperty.call(obj,a)) return obj[a]; }
  for(const k of Object.keys(obj||{})){
    const nk=lcNH(k);
    const ok=na.some(a=>opts.contains?nk.indexOf(a)>=0:(nk===a||nk.indexOf(a+' ')===0||nk.indexOf(' '+a+' ')>=0));
    if(ok){
      if(opts.exclude&&[].concat(opts.exclude).map(lcNH).some(ex=>nk.indexOf(ex)>=0)) continue;
      return obj[k];
    }
  }
  return '';
}
async function lcGGFetch(gid){
  const r=await fetch(lcGGUrl(gid),{cache:'no-store'});
  if(!r.ok) throw new Error('CSV '+gid);
  return lcCsvRows(await r.text());
}
async function lcCarregarMetas(force){
  try{ lcMetas=await dbGetSafe('lc_metas','&mes=eq.'+lcMesFiltro); }catch(e){ lcMetas=[]; }
  if(!Array.isArray(lcMetas)) lcMetas=[];
  if(!force && lcGG.ts && (Date.now()-lcGG.ts)<300000) return;
  try{
    const [rl,rv,rn]=await Promise.all([lcGGFetch(LC_GG_GIDS.lojas),lcGGFetch(LC_GG_GIDS.vendedores),lcGGFetch(LC_GG_GIDS.nbpc)]);
    lcGG.lojas=lcGGParseLojas(rl);
    lcGG.fds=lcGGParseFDS(rl);
    lcGG.vend=lcGGParseVend(rv);

    lcGG.ts=Date.now(); lcGG.erro='';
  }catch(e){ lcGG.erro='Não foi possível ler a planilha. Verifique a conexão.'; }
}
function lcGGParseLojas(rows){
  const raw=lcRowsAuto(rows,['LOJAS','META']);
  const seg=raw.findIndex((r,i)=>i>0 && lcNH(lcFld(r,['LOJAS','LOJA']))==='LOJAS');
  const main=seg>-1?raw.slice(0,seg):raw;
  let atual='';
  return main.map(r=>{
    const lc=lcFld(r,['LOJAS','LOJA']); if(lc) atual=lc.trim();
    const fat=lcMoney(lcFld(r,['JUNHO','FATURAMENTO','JULHO','AGOSTO'],{contains:true,exclude:['META','PERCENTUAL','%']}));
    const meta=lcMoney(lcFld(r,['META REAL','META'],{contains:true,exclude:['ITENS','GAR']}));
    return { loja:atual||'', fat, meta,
      pct:lcPctBR(lcFld(r,['PERCENTUAL','%']))||((fat/meta)*100||0),
      itens:lcNumBR(lcFld(r,['ITENS VENDIDOS','ITENS FEITO','VENDIDOS'],{contains:true,exclude:['META']})),
      metaItens:lcNumBR(lcFld(r,['META ITENS','META DE ITENS'],{contains:true})),
      gar:lcMoney(lcFld(r,['GARANTIA ESTENDIDA','GAR ESTENDIDA','G.A.R FEITO','GAR FEITO'],{contains:true,exclude:['META','%','QT']})),
      metaGar:lcMoney(lcFld(r,['META GAR','META G.A.R','META GARANTIA'],{contains:true})) };
  }).filter(l=>l.loja && (l.fat>0||l.meta>0||l.itens>0));
}
function lcGGParseFDS(rows){
  /* A 2ª tabela da mesma aba (META DO FIM DE SEMANA) recomeça com um cabeçalho
     próprio cuja 1ª coluna volta a ser "LOJAS" — por isso é lida das linhas cruas. */
  const hits=[];
  for(let i=0;i<rows.length;i++){ if(lcNH(rows[i][0])==='LOJAS') hits.push(i); }
  if(hits.length<2) return [];
  const hi=hits[1];
  const hs=(rows[hi]||[]).map(lcNH);
  let cMeta=-1,cFat=-1;
  hs.forEach((h,i)=>{
    if(!h||i===0) return;
    if(cMeta<0 && h.indexOf('META')>=0 && h.indexOf('ITENS')<0 && h.indexOf('GAR')<0) cMeta=i;
    else if(cFat<0 && h.indexOf('%')<0 && h.indexOf('PERCENT')<0 && h.indexOf('META')<0) cFat=i;
  });
  if(cMeta<0) cMeta=2;
  if(cFat<0)  cFat=1;
  const out=[]; let atual='';
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; const nome=String(r[0]||'').trim();
    if(nome) atual=nome;
    if(!atual||/^TOTAL/i.test(atual)) continue;
    const meta=lcMoney(r[cMeta]), fat=lcMoney(r[cFat]);
    if(meta>0||fat>0) out.push({loja:atual, meta, fat});
  }
  return out;
}
function lcGGParseVend(rows){
  const raw=lcRowsAuto(rows,['LOJAS','VENDEDOR','FATURADO','META']);
  let atual='';
  return raw.map(r=>{
    const lc=lcFld(r,['LOJAS','LOJA']); if(lc) atual=lc.trim();
    const fat=lcMoney(lcFld(r,'FATURADO')), meta=lcMoney(lcFld(r,'META'));
    return { loja:atual||'', vendedor:lcFld(r,'VENDEDOR')||'',
      fat, meta, pct:lcPctBR(lcFld(r,['PERCENTUAL','%']))||((fat/meta)*100||0),
      metaRealme:lcNumBR(lcFld(r,['META REALMES','META REALME'],{contains:true})),
      realme:lcNumBR(lcFld(r,['REALMES FEITO','REALME FEITO','REALMES','REALME'],{contains:true,exclude:['META']})),
      metaItens:lcNumBR(lcFld(r,'META ITENS')),
      superItens:lcNumBR(lcFld(r,'SUPER ITENS')),
      itens:lcNumBR(lcFld(r,'ITENS FEITO')),
      metaGar:lcMoney(lcFld(r,['META G.A.R','META GAR'],{contains:true})),
      gar:lcMoney(lcFld(r,['GAR FEITO','G.A.R FEITO','G.A.R','GAR'],{contains:true,exclude:['META','QT']})),
      qtVendas:lcNumBR(lcFld(r,['QT - VENDAS','QT VENDAS'])) };
  }).filter(v=>v.vendedor && !/^TOTAL/i.test(v.vendedor));
}
function lcGGParseNBPC(rows){
  const out=[]; let head=false, cN=-1,cQnb=-1,cQg=-1,cP=-1;
  for(const row of rows){
    const j=row.map(c=>(c||'').toUpperCase()).join('|');
    if(!head && (j.indexOf('QTD NB')>=0 || j.indexOf('VENDIDO')>=0 || j.indexOf('VENDEDOR')>=0)){
      row.forEach((cell,i)=>{
        const k=(cell||'').trim().toUpperCase().replace(/\s+/g,' ');
        if((k.indexOf('LOJA')>=0||k.indexOf('VENDEDOR')>=0)&&cN<0) cN=i;
        if(k.indexOf('QTD NB')>=0&&cQnb<0) cQnb=i;
        if(k.indexOf('QTD GAR')>=0&&cQg<0) cQg=i;
        if((k.indexOf('% GAR')>=0||k.indexOf('PERCENT')>=0||k.indexOf('GAR S/')>=0)&&cP<0) cP=i;
      });
      if(cN<0)cN=0; if(cQnb<0)cQnb=1; if(cQg<0)cQg=3; if(cP<0)cP=5;
      head=true; continue;
    }
    if(!head) continue;
    if(j.indexOf('RANKING')>=0||j.indexOf('POSIÇÃO')>=0||j.indexOf('POSICAO')>=0) break;
    const nome=String(row[cN]||'').trim();
    if(!nome||/^TOTAL/i.test(nome)) continue;
    const nb=lcNumBR(row[cQnb]), g=lcNumBR(row[cQg]);
    if(nb<=0&&g<=0) continue;
    out.push({nome, nb, gar:g, pct:lcPctBR(row[cP])||(nb>0?(g/nb*100):0)});
  }
  return out;
}
function lcCobDe(nome){
  const n=lcNH(nome);
  return lcGG.cob.find(c=>lcNH(c.nome)===n) || lcGG.cob.find(c=>lcNH(c.nome).indexOf(n)>=0||n.indexOf(lcNH(c.nome))>=0) || null;

function lcOntem(){ const d=new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lcDiasMes(mes){ const [a,m]=mes.split('-').map(Number); return new Date(a,m,0).getDate(); }
function lcDiasRestantes(mes){
  const hoje=lcHoje();
  if(mes<hoje.slice(0,7)) return 0;
  if(mes>hoje.slice(0,7)) return lcDiasMes(mes);
  return lcDiasMes(mes)-Number(hoje.slice(8,10))+1;
}
function lcFDSRestantes(mes){
  const [a,m]=mes.split('-').map(Number), tot=lcDiasMes(mes);
  const hoje=lcHoje(); const ini=(mes===hoje.slice(0,7))?Number(hoje.slice(8,10)):1;
  let n=0; for(let d=ini;d<=tot;d++){ const w=new Date(a,m-1,d).getDay(); if(w===0||w===6) n++; }
  return n;
}
function lcPct(feito,meta){ meta=Number(meta)||0; return meta>0?Math.min(999,Math.round((Number(feito)||0)/meta*100)):0; }
function lcBarra(pct,cor){
  const c=cor||(pct>=100?'#22c55e':(pct>=70?'#60A5FA':(pct>=40?'#fbbf24':'#f87171')));
  return '<div class="lc-mbar"><i style="width:'+Math.min(100,pct)+'%;background:'+c+'"></i></div>';
}
function lcLojaFoco(){
  const s=document.getElementById('lcmt_loja');
  if(s&&s.value) return s.value;
  if(typeof lcUserLoja!=='undefined' && lcUserLoja) return lcUserLoja;
  const l=lcGG.lojas[0]; return l?l.loja:lcNomesLojas()[0];
}
function lcOptsLojaGG(sel){
  let nomes=lcGG.lojas.map(l=>l.loja);
  if(!nomes.length) nomes=lcNomesLojas();
  if(typeof lcUserLoja!=='undefined' && lcUserLoja){
    const f=nomes.filter(n=>lcNH(n)===lcNH(lcUserLoja)||lcNH(n).indexOf(lcNH(lcUserLoja))>=0);
    if(f.length) nomes=f;
  }
  return nomes.map(n=>'<option'+(n===sel?' selected':'')+'>'+lcEsc(n)+'</option>').join('');
}
function lcRenderMetas(){

   +'<div class="lc-kpi"><b style="color:#4ade80">'+lcBRL(feito)+'</b><small>Realizado · '+pct+'%</small></div>'

   +(fdsFeito>0?(lcBarra(lcPct(fdsFeito,metaFds))+'<div class="lc-mline"><span>Fim de semana realizado</span><span>'+lcBRL(fdsFeito)+' / '+lcBRL(metaFds)+'</span></div>'):'');

  if(L){

     +'<div class="lc-mline"><span>Garantia estendida</span><span>'+lcBRL(L.gar)+' / '+lcBRL(L.metaGar)+'</span></div>'+lcBarra(lcPct(L.gar,L.metaGar));
  }

  if(vends.length){

      const cb=lcCobDe(v.vendedor);

        +'<span class="lc-bg '+(v.pct>=100?'ok':'mut')+'">'+Math.round(v.pct)+'%</span></div>'
        +'<div class="lc-mline"><span>Faturamento</span><span>'+lcBRL(v.fat)+' / '+lcBRL(v.meta)+'</span></div>'+lcBarra(lcPct(v.fat,v.meta))
        +'<div class="lc-mline"><span>Super Itens</span><span>'+v.superItens+(v.metaItens?' / '+v.metaItens:'')+'</span></div>'+lcBarra(lcPct(v.superItens,v.metaItens))
        +'<div class="lc-mline"><span>Realme</span><span>'+v.realme+' / '+v.metaRealme+'</span></div>'+lcBarra(lcPct(v.realme,v.metaRealme))
        +'<div class="lc-mline"><span>Garantia estendida</span><span>'+lcBRL(v.gar)+' / '+lcBRL(v.metaGar)+'</span></div>'+lcBarra(lcPct(v.gar,v.metaGar))
        +'<div class="lc-mline"><span>Cobertura NB/PC</span><span>'+(cb?Math.round(cb.pct)+'% <small style="color:#7d8ba4">('+cb.gar+' de '+cb.nb+')</small>':'—')+'</span></div>'

async function lcMetasAtualizar(){ lcToast('Atualizando…'); await lcCarregarMetas(true); lcRenderMetas(); lcToast('Atualizado ✓'); }
async function lcTrocarMesMetas(v){ lcMesFiltro=v||lcMes(); await lcCarregarMetas(true); lcRenderMetas(); }
async function lcMetaFdsSalvar(){
  const loja=lcLojaFoco(), val=lcNum(lcVal('lcmt_fds'));
  const ex=lcMetas.find(m=>m.loja===loja && !m.pessoa);
  try{
    if(ex){ await dbUpdate('lc_metas',ex.id,{meta_fds:val}); ex.meta_fds=val; }
    else{
      const reg={mes:lcMesFiltro,loja,pessoa:null,meta_fds:val,faturamento:0};
      const ins=await dbInsert('lc_metas',reg);
      lcMetas.push((Array.isArray(ins)?ins[0]:ins)||reg);
    }
    lcToast('Meta de FDS salva ✓'); lcRenderMetas();
  }catch(e){ lcToast('Erro ao salvar','err'); }
}
function lcMetaTexto(){
  const loja=lcLojaFoco(), L=lcGGLoja(loja), F=lcGGFdsLoja(loja), vends=lcGGVendLoja(loja);
  const alvo=L?L.meta:0, feito=L?L.fat:0, falta=Math.max(0,alvo-feito);
  const dias=lcDiasRestantes(lcMesFiltro), pct=lcPct(feito,alvo);
  const metaFds=lcMetaFdsManual(loja)||(F?F.meta:0);
  const lin=['📊 ACOMPANHAMENTO '+lcUp(loja),'Base: '+lcDataBR(lcOntem()),'',
    'META DO MÊS: '+lcBRL(alvo),
    'REALIZADO: '+lcBRL(feito)+' ('+pct+'%)',
    'FALTA: '+lcBRL(falta),
    'META DIÁRIA: '+lcBRL(dias>0?falta/dias:0)+' ('+dias+' dias restantes)'];
  if(metaFds>0) lin.push('META FIM DE SEMANA: '+lcBRL(metaFds)+(F&&F.fat>0?' · feito '+lcBRL(F.fat):''));
  if(L){
    lin.push('','🏬 LOJA');
    lin.push('ITENS: '+L.itens+'/'+L.metaItens);
    lin.push('GARANTIA: '+lcBRL(L.gar)+' / '+lcBRL(L.metaGar));
  }
  if(vends.length){
    lin.push('','👥 CONSULTORES');
    vends.forEach(v=>{
      const cb=lcCobDe(v.vendedor);
      lin.push(lcUp(v.vendedor)+' — '+Math.round(v.pct)+'%');
      lin.push('  FAT: '+lcBRL(v.fat)+' / '+lcBRL(v.meta));
      lin.push('  SUPER ITENS: '+v.superItens+(v.metaItens?'/'+v.metaItens:'')+' · REALME: '+v.realme+'/'+v.metaRealme);
      lin.push('  GARANTIA: '+lcBRL(v.gar)+' / '+lcBRL(v.metaGar));
      lin.push('  COBERTURA NB/PC: '+(cb?Math.round(cb.pct)+'% ('+cb.gar+' de '+cb.nb+')':'—'));
    });
  }
  return lin.join('\n');
}
function lcMetaScript(){
  const el=document.getElementById('lcmt-out');
  el.textContent=lcMetaTexto(); el.style.display=''; lcCopiar('lcmt-out');
}
function lcMetaImagem(){
  const alvo=document.getElementById('lc-meta-print');
  if(!alvo){ lcToast('Nada para capturar','err'); return; }
  if(typeof html2canvas==='undefined'){ lcToast('Gerador de imagem indisponível','err'); return; }
  lcToast('Gerando imagem…');
  const preto=document.documentElement.classList.contains('preto');
  const dark=document.documentElement.classList.contains('dark');
  const bg=preto?'#000000':(dark?'#0e1d38':'#ffffff');
  html2canvas(alvo,{backgroundColor:bg,scale:2,useCORS:true,logging:false}).then(cv=>{
    cv.toBlob(b=>{
      const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download='metas_'+lcLojaFoco().replace(/\W+/g,'_')+'_'+lcOntem()+'.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      lcToast('Imagem salva ✓');
    });
  }).catch(()=>lcToast('Falha ao gerar imagem','err'));
}

function lcRotinaItens(){
  const f=LC_ROTINA[lcRotinaFuncao];
  if(!f) return [];
  if(!f.porDia) return f.itens.map((x,i)=>({key:lcRotinaFuncao+'_'+i, g:x.g, t:x.t}));
  const dia = (lcRotinaDia==null) ? new Date(lcHoje()+'T12:00:00').getDay() : lcRotinaDia;
  const bloco=f.itens[dia]||{loja:'',itens:[]};
  return bloco.itens.map((t,i)=>({key:'op_'+dia+'_'+i, g:bloco.loja||LC_DIAS[dia], t}));
}
function lcRotinaChk(key){ return lcRotinaChecks.find(c=>c.item_key===key && c.data===lcHoje() && String(c.pin||'')===String(lcPinAtual()||'')); }
function lcPinAtual(){ return (typeof lcUserPin!=='undefined' && lcUserPin) ? lcUserPin : 'painel'; }
async function lcCarregarRotina(){
  try{ lcRotinaChecks = await dbGetSafe('lc_rotina_checks','&data=eq.'+lcHoje()); }catch(e){ lcRotinaChecks=[]; }
  if(!Array.isArray(lcRotinaChecks)) lcRotinaChecks=[];
}
function lcRenderRotina(){
  const body=document.getElementById('lc-body');
  const dia=(lcRotinaDia==null)?new Date(lcHoje()+'T12:00:00').getDay():lcRotinaDia;
  const itens=lcRotinaItens();
  const feitos=itens.filter(i=>{ const c=lcRotinaChk(i.key); return c&&c.feito; }).length;
  const pct=itens.length?Math.round(feitos/itens.length*100):0;
  let listas='', g='';
  itens.forEach(it=>{
    if(it.g!==g){ listas+='<div class="lc-grp">'+lcEsc(it.g)+'</div>'; g=it.g; }
    const c=lcRotinaChk(it.key), ok=c&&c.feito;
    listas+='<label class="lc-miss'+(ok?' ok':'')+'"><input type="checkbox" '+(ok?'checked':'')
      +' onchange="lcRotinaToggle(\''+it.key+'\')"><div class="lc-miss-body"><div class="lc-miss-t">'+lcEsc(it.t)+'</div></div></label>';
  });
  body.innerHTML =
   '<div class="lc-card"><div class="lc-h">🔁 Rotina do dia</div>'
  +'<div class="lc-chips">'+Object.keys(LC_ROTINA).map(f=>
      '<span class="lc-chip'+(lcRotinaFuncao===f?' on':'')+'" onclick="lcRotinaSetFuncao(\''+f+'\')">'+LC_ROTINA[f].lbl+'</span>').join('')+'</div>'
  +(LC_ROTINA[lcRotinaFuncao].porDia?('<div class="lc-f" style="margin-top:11px"><label>Dia da semana</label>'
      +'<select onchange="lcRotinaSetDia(this.value)">'
      +[1,2,3,4,5,6,0].map(d=>'<option value="'+d+'"'+(d===dia?' selected':'')+'>'+LC_DIAS[d]
      +(LC_ROTINA.operacional.itens[d]&&LC_ROTINA.operacional.itens[d].loja?' · '+LC_ROTINA.operacional.itens[d].loja:'')+'</option>').join('')
      +'</select></div>'):'')
  +'<div class="lc-prog" style="margin-top:12px"><div class="lc-prog-bar"><i style="width:'+pct+'%"></i></div>'
  +'<span>'+feitos+' de '+itens.length+' concluídas · '+pct+'%</span></div>'
  +(itens.length?listas:'<div class="lc-empty">Sem itens para este dia.</div>')

async function lcRotinaToggle(key){
  const c=lcRotinaChk(key);
  try{
    if(c){ const novo=!c.feito; await dbUpdate('lc_rotina_checks',c.id,{feito:novo}); c.feito=novo; }
    else{
      const reg={pin:String(lcPinAtual()),data:lcHoje(),item_key:key,feito:true,funcao:lcRotinaFuncao};
      const ins=await dbInsert('lc_rotina_checks',reg);
      lcRotinaChecks.push((Array.isArray(ins)?ins[0]:ins)||reg);
    }
  }catch(e){
    if(c) c.feito=!c.feito;
    else lcRotinaChecks.push({id:'tmp'+Date.now(),pin:String(lcPinAtual()),data:lcHoje(),item_key:key,feito:true});
  }
  lcRenderRotina();
}
function lcRotinaScript(){
  const dia=(lcRotinaDia==null)?new Date(lcHoje()+'T12:00:00').getDay():lcRotinaDia;
  const itens=lcRotinaItens();
  if(!itens.length){ lcToast('Sem itens','err'); return; }
  let cab;
  if(lcRotinaFuncao==='operacional'){
    const loja=(LC_ROTINA.operacional.itens[dia]||{}).loja||'';
    cab='*ROTINA OPERACIONAL'+(loja?' - '+loja:'')+' ✅*';
  } else cab='*ROTINA '+lcUp(LC_ROTINA[lcRotinaFuncao].lbl)+' — '+lcDataBR(lcHoje())+' ✅*';
  const lin=[cab,''];
  itens.forEach(it=>{ const c=lcRotinaChk(it.key); lin.push((c&&c.feito?'✅':'•')+' '+lcUp(it.t)); });
  const sup=lcMenc('supervisao'); if(sup){ lin.push(''); lin.push(sup); }
  const el=document.getElementById('lcrt-out');
  el.textContent=lin.join('\n'); el.style.display=''; lcCopiar('lcrt-out');
}

function lcLinkDe(u){ return lcBaseURL()+'?pin='+encodeURIComponent(u.pin); }
function lcCopiarLink(id){
  const u=lcUsuarios.find(x=>String(x.id)===String(id)); if(!u) return;

}
function lcAbrirLink(id){

function lcScriptAcesso(id){

/* ═══ 11. MÉTRICAS — card visual gerado da planilha ════════════════════ */
const LC_GG_GIDS2={site:'133382153', payjoy:'1627327546', crefaz:'176552279',
                   parcelex:'924921302', venda_pa:'694436534', venda_uni:'1648864070'};
let lcMx={sel:{lojas:[],vend:[]}, extras:{}, cred:null, periodo:'', obs:'', frase:''};

function lcMxKey(n){ return lcNH(n).replace(/[^A-Z0-9]/g,'_'); }
function lcMxExtra(nome,campo){
  const k=lcMxKey(nome)+'__'+campo;
  return lcMx.extras[k]!==undefined?lcMx.extras[k]:'';
}
function lcMxSetExtra(nome,campo,v){ lcMx.extras[lcMxKey(nome)+'__'+campo]=v; lcMxSalvar(); }
function lcMxSalvar(){ try{ localStorage.setItem('lc_mx',JSON.stringify(lcMx)); }catch(e){} }
function lcMxCarregar(){
  try{ const s=localStorage.getItem('lc_mx'); if(s){ const o=JSON.parse(s);
    if(o&&o.extras) lcMx=Object.assign(lcMx,o); } }catch(e){}
}
async function lcMxCred(){
  if(lcMx.cred) return lcMx.cred;
  const out={site:{},payjoy:{},crefaz:{},parcelex:{},venda_pa:{},venda_uni:{}};
  try{
    const keys=Object.keys(LC_GG_GIDS2);
    const res=await Promise.all(keys.map(k=>lcGGFetch(LC_GG_GIDS2[k]).catch(()=>[])));
    keys.forEach((k,i)=>{
      const raw=lcRowsAuto(res[i],['ID DA VENDA','VENDEDOR','VALOR']);
      const vistos={};
      raw.forEach(r=>{
        const id=lcFld(r,['ID DA VENDA','ID VENDA','ID']);
        const vd=lcFld(r,'VENDEDOR')||'';
        const val=lcMoney(lcFld(r,'VALOR'));
        if(val<=0||!vd) return;
        const chave=k+'|'+(id||Math.random());
        if(id && vistos[chave]) return;
        if(id) vistos[chave]=1;
        const n=lcNH(vd);
        out[k][n]=(out[k][n]||0)+val;
      });
    });
  }catch(e){}
  lcMx.cred=out; return out;
}
function lcMxCredDe(nome){
  const c=lcMx.cred||{}, n=lcNH(nome);
  const g=k=>(c[k]&&c[k][n])||0;
  return {site:g('site'), payjoy:g('payjoy'), crefaz:g('crefaz'),
          parcelex:g('parcelex'), venda_pa:g('venda_pa'), venda_uni:g('venda_uni')};
}
function lcDiasUteisAte(mes){
  const [a,m]=mes.split('-').map(Number);
  const hoje=lcHoje(); const lim=(mes===hoje.slice(0,7))?Number(hoje.slice(8,10))-1:lcDiasMes(mes);
  let n=0; for(let d=1;d<=lim;d++){ if(new Date(a,m-1,d).getDay()!==0) n++; }
  return Math.max(1,n);
}

   +'<label class="lc-lb" style="margin-top:12px">Consultores</label><div class="lc-chips">'

       +'" onclick="lcMxTgl(\'vend\',\''+lcEsc(v).replace(/'/g,"\\'")+'\')">'+lcEsc(v)+'</span>').join('')
     :'<span class="lc-hint">Nenhum consultor carregado.</span>')+'</div>'

  /* campos complementares */

function lcMxTgl(tipo,nome){
  const a=lcMx.sel[tipo], i=a.indexOf(nome);
  if(i>=0) a.splice(i,1); else a.push(nome);
  lcMxSalvar(); lcRenderMetricas();
}
function lcMxSelTodos(){
  lcMx.sel.lojas=lcGG.lojas.map(l=>l.loja);
  lcMx.sel.vend=lcGG.vend.map(v=>v.vendedor);
  lcMxSalvar(); lcRenderMetricas();

     +'</div></div>'

     +'<div class="mx-pct">'+pct.toFixed(2).replace('.',',')+'%</div></div>'

     + (siteM?lcMxMini('🌐','Site',lcBRL(siteM)):'')

     + lcMxMini('🛡️','Garantia Ext.',lcBRL(L.gar)+' / '+lcBRL(L.metaGar))
     + (gi?lcMxMini('💻','GAR Informática',gi+'%'):'')
     +'</div></div>';

  if(lcMx.sel.vend.length){
    h+='<div class="mx-vlabel">👥 CONSULTORES</div><div class="mx-grid">';
    lcMx.sel.vend.forEach(nome=>{
      const V=lcGG.vend.find(x=>x.vendedor===nome); if(!V) return;
      const cb=lcCobDe(nome), cr=lcMxCredDe(nome);
      const pct=V.pct||0, falta=Math.max(0,V.meta-V.fat);
      const dias=lcNum(lcMxExtra(nome,'dias'))||lcDiasUteisAte(lcMesFiltro);
      const st=lcMxExtra(nome,'status')||'EM ANDAMENTO';
      const nota=lcMxExtra(nome,'nota');

       +'<div class="mx-vsub">'+lcEsc(V.loja||'')+'</div></div><span class="mx-tag">'+lcEsc(st)+'</span></div>'

       +'<div class="mx-vday">Diária: '+lcBRL(dias>0?V.fat/dias:0)+' (para '+String(dias).padStart(2,'0')+' dias trabalhados)</div>'
       +'<div class="mx-vg2">'

function lcMxMini(ic,lbl,val){
  return '<div class="mx-m"><span>'+ic+' '+lcEsc(lbl)+'</span><b>'+lcEsc(val)+'</b></div>';
}
function lcMxBloco(titulo,feito,meta,nota,tipo){
  const p=meta>0?Math.min(100,(feito/meta)*100):0;
  const falta=Math.max(0,meta-feito);
  const fmt=v=>tipo==='money'?lcBRL(v):String(v);
  return '<div class="mx-b"><div class="mx-bh"><span>'+lcEsc(titulo)+'</span>'
   +(falta>0?'<em class="'+(p>=70?'ok':'wn')+'">Faltando: '+fmt(falta)+'</em>':'<em class="ok">✓ Batido</em>')+'</div>'
   +'<div class="mx-bv"><small>Meta: '+fmt(meta)+'</small><b>'+fmt(feito)+'</b></div>'
   +'<div class="mx-bar sm"><i style="width:'+p.toFixed(1)+'%;background:'+(p>=100?'#16a34a':(p>=60?'#2563eb':'#f97316'))+'"></i></div>'
   +(nota?'<div class="mx-bn">'+lcEsc(nota)+'</div>':'')+'</div>';
}
function lcMxBlocoCred(titulo,valor,meta){
  return '<div class="mx-b"><div class="mx-bh"><span>'+lcEsc(titulo)+'</span></div>'
   +'<div class="mx-bv"><small>Meta: '+lcEsc(meta||'00')+'</small><b>'+lcBRL(valor)+'</b></div>'
   +'<div class="mx-bar sm"><i style="width:'+(valor>0?100:0)+'%;background:#16a34a"></i></div></div>';
}
function lcMxTexto(){
  const lin=['📊 MÉTRICAS '+(lcMx.periodo||''),'Base: '+lcDataBR(lcOntem()),''];
  lcMx.sel.lojas.forEach(n=>{
    const L=lcGGLoja(n); if(!L) return;
    const falta=Math.max(0,L.meta-L.fat), rest=lcDiasRestantes(lcMesFiltro);
    lin.push('🏬 '+lcUp(n));
    lin.push('  META: '+lcBRL(L.meta)+' · FEITO: '+lcBRL(L.fat)+' ('+lcPct(L.fat,L.meta)+'%)');
    lin.push('  FALTANDO: '+lcBRL(falta)+' · DIÁRIA: '+lcBRL(rest>0?falta/rest:0));
    lin.push('  ITENS: '+L.itens+'/'+L.metaItens+' · GARANTIA: '+lcBRL(L.gar)+'/'+lcBRL(L.metaGar));
    const a=lcNum(lcMxExtra(n,'assist')), g=lcNum(lcMxExtra(n,'gordura'));
    if(a) lin.push('  ASSISTÊNCIA: '+lcBRL(a));
    if(g) lin.push('  GORDURA: '+lcBRL(g));
    lin.push('');
  });
  lcMx.sel.vend.forEach(n=>{
    const V=lcGG.vend.find(x=>x.vendedor===n); if(!V) return;
    const cb=lcCobDe(n), cr=lcMxCredDe(n);
    lin.push('👤 '+lcUp(n)+' — '+Math.round(V.pct)+'%');
    lin.push('  FAT: '+lcBRL(V.fat)+' / '+lcBRL(V.meta));
    lin.push('  SUPER ITENS: '+V.superItens+'/'+V.metaItens+' · REALME: '+V.realme+'/'+V.metaRealme);
    lin.push('  GAR: '+lcBRL(V.gar)+' / '+lcBRL(V.metaGar));
    if(cb) lin.push('  COBERTURA NB/PC: '+Math.round(cb.pct)+'% ('+cb.gar+' de '+cb.nb+')');
    const tot=cr.crefaz+cr.payjoy+cr.parcelex;
    if(tot>0) lin.push('  CREDIÁRIO: CREFAZ '+lcBRL(cr.crefaz)+' · PAYJOY '+lcBRL(cr.payjoy)+' · PARCELEX '+lcBRL(cr.parcelex));
    lin.push('');
  });
  const el=document.getElementById('lcmx-out');
  el.textContent=lin.join('\n').trim(); el.style.display=''; lcCopiar('lcmx-out');
}
function lcMxImagem(){
  const alvo=document.getElementById('lc-mx-print');
  if(!alvo){ lcToast('Selecione ao menos uma loja ou consultor','err'); return; }
  if(typeof html2canvas==='undefined'){ lcToast('Gerador de imagem indisponível','err'); return; }
  lcToast('Gerando imagem…');
  const w=document.createElement('div');
  w.style.cssText='position:fixed;left:-9999px;top:0;width:1180px;background:#eef2f7;padding:18px';
  const cl=alvo.cloneNode(true); w.appendChild(cl); document.body.appendChild(w);
  html2canvas(cl,{backgroundColor:'#eef2f7',scale:2,useCORS:true,logging:false}).then(cv=>{
    document.body.removeChild(w);
    cv.toBlob(b=>{
      const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download='metricas_'+lcOntem()+'.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      lcToast('Imagem salva ✓');
    });
  }).catch(()=>{ try{document.body.removeChild(w);}catch(e){} lcToast('Falha ao gerar imagem','err'); });
}
</script>

const _optsOrig=lcOptsLoja;
lcOptsLoja=function(sel,semSite){
  if(lcUserLoja){
    const nomes=lcNomesLojas().filter(n=>n===lcUserLoja||(!semSite&&n==='SITE'));
    if(nomes.length) return nomes.map(n=>'<option'+(n===(sel||lcUserLoja)?' selected':'')+'>'+lcEsc(n)+'</option>').join('');
  }
  return _optsOrig(sel,semSite);
};
