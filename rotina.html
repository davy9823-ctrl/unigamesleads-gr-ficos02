<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rotina Comercial · UniGames</title>
<style>
  :root{ --bg:#0b1424; --bg2:#101d33; --card:#132a4d; --card2:#0f2140; --bd:#24406b; --tx:#eaf1fb; --tx2:#9fb3d4; --tx3:#6b80a6; --accent:#4d8ef7; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:linear-gradient(160deg,#0b1424,#0d1b3d);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:0}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 60px}
  .brand{text-align:center;padding:16px 0 8px}
  .brand .u{font-size:26px;font-weight:900;letter-spacing:-.02em}
  .brand .t{font-size:8px;font-weight:800;letter-spacing:.4em;text-transform:uppercase;color:#aecdf5;margin-top:2px}
  .badge{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#0f2148;background:#cfe3ff;border-radius:22px;padding:6px 16px;margin-top:8px}
  .card{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
  .btit{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#7bbcff;margin:2px 0 10px}
  .item{display:flex;align-items:center;gap:11px;padding:13px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card);transition:border-color .15s,background .15s}
  .item.done{border-color:var(--green);background:rgba(34,197,94,.10)}
  .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
  .item.done .chk{background:var(--green);border-color:var(--green)}
  .txt{flex:1;font-size:14px;line-height:1.35}
  .cnt{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .cnt button{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;font-weight:800}
  .cnt .n{font-size:14px;font-weight:800;min-width:48px;text-align:center}
  .prog{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:6px 0 2px}
  .prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#16a34a);transition:width .3s}
  input{width:100%;height:46px;background:var(--bg2);border:1px solid var(--bd);border-radius:11px;color:var(--tx);padding:0 14px;font-size:16px;text-align:center;letter-spacing:.3em}
  .btn{width:100%;height:48px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;margin-top:12px}
  .msg{text-align:center;color:var(--tx3);font-size:13px;padding:10px}
  .hd{text-align:center;margin-bottom:6px}
  .hd .nm{font-size:19px;font-weight:900}
  .hd .lj{font-size:12px;color:var(--tx2)}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .top .d{font-size:12px;color:var(--tx2)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#132a4d;border:1px solid var(--bd);color:var(--tx);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toast.on{opacity:1}
  .mon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .mon-stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px;text-align:center}
  .mon-stat .v{font-size:22px;font-weight:900;line-height:1}
  .mon-stat .l{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .mon-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .mon-pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
  .mon-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--bd)}
  .mon-row:first-of-type{border-top:none}
  .mon-row .nm2{flex:1;font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mon-bar{flex:1.4;height:16px;border-radius:5px;background:var(--bg2);overflow:hidden}
  .mon-bar>span{display:block;height:100%;border-radius:5px;transition:width .4s}
  .mon-pct{font-size:12px;font-weight:800;width:38px;text-align:right;flex-shrink:0}
  .mon-sub{font-size:10.5px;color:var(--tx3);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .mon-hist{display:flex;align-items:flex-end;gap:4px;height:74px;padding:4px 2px 0}
  .mon-hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .mon-hist .col .bar{width:100%;max-width:22px;border-radius:4px 4px 0 0;transition:height .4s}
  .mon-hist .col .dl{font-size:8px;color:var(--tx3)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="u">Unigames</div><div class="t">Lugar de Tecnologia</div><div class="badge">🎯 Rotina Comercial</div></div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://ipjlmpelgikewnhnfbbt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwamxtcGVsZ2lrZXduaG5mYmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDcyMjYsImV4cCI6MjA5MzQ4MzIyNn0.9ZF7v0tprywrEyTua_5iTKWKNPKJ5Oto2f2Q_YNx_Po';
const H={'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'};
async function dbGet(t,p=''){ const r=await fetch(SUPA_URL+'/rest/v1/'+t+'?'+p,{headers:H}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbInsert(t,d){ const b={...d};delete b.id; const r=await fetch(SUPA_URL+'/rest/v1/'+t,{method:'POST',headers:H,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbUpdate(t,id,d){ const b={...d};delete b.id; const r=await fetch(SUPA_URL+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

const BLOCOS_CONSULTOR=[
  {bloco:'BLOCO 1 · Dinâmica no salão',itens:[
    {key:'b1_contato',txt:'Após cada atendimento, salve o contato e registre o resultado.'},
    {key:'b1_followup',txt:'Em janela de menor fluxo, faça follow-ups e atualize atendimentos pendentes.'},
    {key:'b1_canais',txt:'Cubra os canais: WhatsApp, Instagram, grupo de indicações, Marketplace e ClickMassa.'},
    {key:'b1_status',txt:'Publique o status do dia.'},
    {key:'b1_retomada',txt:'Se o atendimento interromper a rotina, anote onde parou e retome no próximo bloco.'},
  ]},
  {bloco:'BLOCO 2 · Digital / Prospecção',itens:[
    {key:'b2_pentefino',txt:'Faça o pente fino nos atendimentos de todos os canais.'},
    {key:'b2_pipeline',txt:'Revise a pipeline: etapas e próxima ação.'},
    {key:'b2_ligacoes',txt:'Ligações de prospecção',type:'count',meta:10},
    {key:'b2_crm',txt:'Registre cada contato no ClickMassa/CRM.'},
  ]},
  {bloco:'BLOCO 4 · Finalizando o dia',itens:[
    {key:'b4_metas',txt:'Recapitule se atingiu suas metas diárias.'},
    {key:'b4_garimpa',txt:'Faça uma garimpagem e envie o seu link no MKP.'},
    {key:'b4_pentedia',txt:'Faça o pente fino e atualize todos os atendimentos realizados no dia.'},
    {key:'b4_grupos',txt:'Faça o pente fino em todos os grupos.'},
  ]},
  {bloco:'RESULTADOS DO DIA',itens:[
    {key:'r_lead_mkp',   txt:'✅ Lead convertido · Marketplace',       type:'count', resultado:true},
    {key:'r_lead_wpp',   txt:'✅ Lead convertido · ClickMassa/WhatsApp',type:'count', resultado:true},
    {key:'r_lead_insta', txt:'✅ Lead convertido · Instagram',          type:'count', resultado:true},
    {key:'r_posvenda',   txt:'📞 Pós-venda realizado',                  resultado:true},
    {key:'r_link_env',   txt:'🔗 Links Marketplace · Enviados',         type:'count', resultado:true},
    {key:'r_link_conv',  txt:'🔗 Links Marketplace · Convertidos',      type:'count', resultado:true},
  ]},
];
const BLOCO_LIDER={bloco:'BLOCO 3 · Liderança',itens:[
  {key:'b3_visita',txt:'Visite os indicadores 2× por semana (com vendedores).'},
  {key:'b3_pix',txt:'Solicite o Pix dos indicadores.'},
  {key:'b3_planilha',txt:'Atualize a planilha de indicação.'},
]};
// itens de ESFORÇO do consultor (entram no %); resultados ficam de fora
const ITENS_ESFORCO = BLOCOS_CONSULTOR.flatMap(b=>b.itens).filter(it=>!it.resultado);
const RC_RESULT_META = [
  {key:'r_lead_mkp',tipo:'count'},{key:'r_lead_wpp',tipo:'count'},{key:'r_lead_insta',tipo:'count'},
  {key:'r_posvenda',tipo:'check'},{key:'r_link_env',tipo:'count'},{key:'r_link_conv',tipo:'count'},
];
// estado de monitoramento (só líder)
let EQUIPE=[];        // consultores da loja do líder
let EQ_CHECK_HOJE=[]; // check-ins da equipe no dia
let EQ_CHECK_HIST=[]; // check-ins da equipe nos últimos 7 dias
const _cor=p=>p>=80?'#22c55e':p>=40?'#f59e0b':'#ef4444';
function _statsDia(pid, regs){
  let feitos=0, lig=0;
  ITENS_ESFORCO.forEach(it=>{
    const r=regs.find(x=>String(x.pessoa_id)===String(pid)&&x.item_key===it.key);
    if(it.key==='b2_ligacoes'&&r) lig=Number(r.contador)||0;
    if(r&&r.feito) feitos++;
  });
  const tot=ITENS_ESFORCO.length;
  return {feitos,total:tot,pct:tot?Math.round(feitos/tot*100):0,ligacoes:lig};
}
function _resultados(regs, pid){
  const out={}; RC_RESULT_META.forEach(m=>out[m.key]=0);
  regs.forEach(r=>{ if(pid!=null&&String(r.pessoa_id)!==String(pid))return; const m=RC_RESULT_META.find(x=>x.key===r.item_key); if(!m)return; if(m.tipo==='count')out[m.key]+=Number(r.contador)||0; else out[m.key]+=(r.feito?1:0); });
  return out;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('on'),1800); }

let PESSOA=null, DATA=hoje(), CHECKINS=[];
const app=document.getElementById('app');

async function boot(){
  const token=new URLSearchParams(location.search).get('p');
  if(!token){ app.innerHTML='<div class="card msg">Link inválido. Peça um novo link ao gestor.</div>'; return; }
  let pessoas=[];
  try{ pessoas=await dbGet('rc_pessoas','token=eq.'+encodeURIComponent(token)+'&select=*'); }
  catch(e){ app.innerHTML='<div class="card msg">Erro ao conectar. Tente novamente.</div>'; return; }
  if(!pessoas.length){ app.innerHTML='<div class="card msg">Acesso não encontrado. Peça um novo link ao gestor.</div>'; return; }
  PESSOA=pessoas[0];
  telaPin();
}
function telaPin(){
  app.innerHTML=`<div class="card">
    <div class="hd"><div class="nm">Olá, ${esc((PESSOA.nome||'').split(' ')[0])}!</div><div class="lj">${esc(PESSOA.loja)} · ${PESSOA.papel==='lider'?'Líder':'Consultor'}</div></div>
    <div class="msg">Digite seu PIN de 4 dígitos para entrar</div>
    <input id="pin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <button class="btn" onclick="validarPin()">Entrar</button>
  </div>`;
  const i=document.getElementById('pin'); i.focus();
  i.addEventListener('keydown',e=>{ if(e.key==='Enter') validarPin(); });
}
function validarPin(){
  const v=(document.getElementById('pin').value||'').trim();
  if(v!==String(PESSOA.pin)){ toast('PIN incorreto ❌'); return; }
  carregar();
}
async function carregar(){
  try{ CHECKINS=await dbGet('rc_checkins','pessoa_id=eq.'+PESSOA.id+'&data=eq.'+DATA+'&select=*'); }
  catch(e){ CHECKINS=[]; }
  if(PESSOA.papel==='lider'){ await carregarEquipe(); }
  render();
}
// Carrega consultores da MESMA loja do líder + check-ins deles (hoje e últimos 7 dias)
async function carregarEquipe(){
  try{
    EQUIPE=await dbGet('rc_pessoas','loja=eq.'+encodeURIComponent(PESSOA.loja)+'&papel=eq.consultor&select=*');
  }catch(e){ EQUIPE=[]; }
  if(!EQUIPE.length){ EQ_CHECK_HOJE=[]; EQ_CHECK_HIST=[]; return; }
  const ids=EQUIPE.map(p=>p.id).filter(x=>x!=null&&!String(x).startsWith('tmp')).join(',');
  if(!ids){ EQ_CHECK_HOJE=[]; EQ_CHECK_HIST=[]; return; }
  const d7=new Date(); d7.setDate(d7.getDate()-6);
  const desde=d7.getFullYear()+'-'+String(d7.getMonth()+1).padStart(2,'0')+'-'+String(d7.getDate()).padStart(2,'0');
  try{ EQ_CHECK_HOJE=await dbGet('rc_checkins','pessoa_id=in.('+ids+')&data=eq.'+DATA+'&select=*'); }
  catch(e){ EQ_CHECK_HOJE=[]; }
  try{ EQ_CHECK_HIST=await dbGet('rc_checkins','pessoa_id=in.('+ids+')&data=gte.'+desde+'&data=lte.'+DATA+'&select=*'); }
  catch(e){ EQ_CHECK_HIST=[]; }
}
function reg(key){ return CHECKINS.find(c=>c.item_key===key&&c.data===DATA); }
function blocos(){ return PESSOA.papel==='lider'? [BLOCO_LIDER] : BLOCOS_CONSULTOR; }
function stats(){
  const itens=blocos().flatMap(b=>b.itens).filter(it=>!it.resultado); let feitos=0;
  itens.forEach(it=>{ const r=reg(it.key); if(r&&r.feito) feitos++; });
  return {feitos,total:itens.length,pct:itens.length?Math.round(feitos/itens.length*100):0};
}
async function toggle(key){
  const r=reg(key);
  try{
    if(r){ const n=!r.feito; await dbUpdate('rc_checkins',r.id,{feito:n}); r.feito=n; }
    else{ const ins=await dbInsert('rc_checkins',{pessoa_id:PESSOA.id,data:DATA,item_key:key,feito:true,contador:0}); CHECKINS.push((Array.isArray(ins)?ins[0]:ins)); }
  }catch(e){ toast('Sem conexão — tente de novo'); return; }
  render();
}
async function count(key,delta,meta){
  let r=reg(key); let val=Math.max(0,(r?Number(r.contador)||0:0)+delta); const feito=meta?val>=meta:val>0;
  try{
    if(r){ await dbUpdate('rc_checkins',r.id,{contador:val,feito}); r.contador=val; r.feito=feito; }
    else{ const ins=await dbInsert('rc_checkins',{pessoa_id:PESSOA.id,data:DATA,item_key:key,feito,contador:val}); CHECKINS.push((Array.isArray(ins)?ins[0]:ins)); }
  }catch(e){ toast('Sem conexão — tente de novo'); return; }
  render();
}
// ── PAINEL DE MONITORAMENTO DA EQUIPE (só líder) ──
function painelEquipe(){
  if(!EQUIPE.length) return '<div class="card"><div class="btit">👥 Minha equipe</div><div class="msg">Nenhum consultor cadastrado nesta loja.</div></div>';
  // resultados e stats do dia
  const totRes=_resultados(EQ_CHECK_HOJE,null);
  const leads=totRes.r_lead_mkp+totRes.r_lead_wpp+totRes.r_lead_insta;
  const taxaLink=totRes.r_link_env>0?Math.round(totRes.r_link_conv/totRes.r_link_env*100):0;
  let somaPct=0, totLig=0;
  const linhas=EQUIPE.map(c=>{ const st=_statsDia(c.id,EQ_CHECK_HOJE); somaPct+=st.pct; totLig+=st.ligacoes; return {c,st}; }).sort((a,b)=>b.st.pct-a.st.pct);
  const pctMedio=EQUIPE.length?Math.round(somaPct/EQUIPE.length):0;

  let h='<div class="card"><div class="btit">👥 Equipe · '+esc(PESSOA.loja)+' · hoje</div>';
  // KPIs do dia
  h+='<div class="mon-grid">'
    +'<div class="mon-stat"><div class="v" style="color:'+_cor(pctMedio)+'">'+pctMedio+'%</div><div class="l">Conclusão média</div></div>'
    +'<div class="mon-stat"><div class="v" style="color:#22c55e">'+leads+'</div><div class="l">Leads convertidos</div></div>'
    +'<div class="mon-stat"><div class="v" style="color:#4d8ef7">'+totRes.r_posvenda+'</div><div class="l">Pós-vendas</div></div>'
    +'<div class="mon-stat"><div class="v" style="color:#f59e0b">'+totLig+'</div><div class="l">Ligações</div></div>'
    +'</div>';
  // pílulas de fonte
  h+='<div class="mon-pills">'
    +'<span class="mon-pill" style="background:#22c55e22;color:#22c55e">🛒 MKP '+totRes.r_lead_mkp+'</span>'
    +'<span class="mon-pill" style="background:#22c55e22;color:#22c55e">💬 WhatsApp '+totRes.r_lead_wpp+'</span>'
    +'<span class="mon-pill" style="background:#22c55e22;color:#22c55e">📸 Insta '+totRes.r_lead_insta+'</span>'
    +'<span class="mon-pill" style="background:#f59e0b22;color:#f59e0b">🔗 Links '+taxaLink+'%</span>'
    +'</div>';
  // ranking dos consultores (hoje)
  h+='<div class="mon-sub">Consultores · hoje</div>';
  linhas.forEach(({c,st})=>{
    const cor=_cor(st.pct);
    h+='<div class="mon-row"><span class="nm2">'+esc(c.nome)+'</span>'
      +'<div class="mon-bar"><span style="width:'+st.pct+'%;background:'+cor+'"></span></div>'
      +'<span class="mon-pct" style="color:'+cor+'">'+st.pct+'%</span>'
      +'<span style="font-size:11px;color:var(--tx3);flex-shrink:0">☎️'+st.ligacoes+'</span></div>';
  });
  h+='</div>';

  // histórico 7 dias (conclusão média/dia da equipe)
  const porData={}; EQ_CHECK_HIST.forEach(r=>{ (porData[r.data]=porData[r.data]||[]).push(r); });
  const serie=[]; const base=new Date(); base.setDate(base.getDate()-6);
  for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(base.getDate()+i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const regs=porData[iso]||[]; let sp=0; EQUIPE.forEach(c=>{ sp+=_statsDia(c.id,regs).pct; });
    serie.push({dd:iso.slice(8)+'/'+iso.slice(5,7), pct:EQUIPE.length?Math.round(sp/EQUIPE.length):0});
  }
  const leadsPer=_resultados(EQ_CHECK_HIST,null); const lp=leadsPer.r_lead_mkp+leadsPer.r_lead_wpp+leadsPer.r_lead_insta;
  const maxP=Math.max(10,...serie.map(x=>x.pct));
  h+='<div class="card"><div class="btit">📈 Histórico · 7 dias</div>';
  h+='<div class="mon-grid" style="grid-template-columns:repeat(2,1fr)">'
    +'<div class="mon-stat"><div class="v" style="color:#22c55e">'+lp+'</div><div class="l">Leads acum.</div></div>'
    +'<div class="mon-stat"><div class="v" style="color:#f59e0b">'+leadsPer.r_link_conv+'</div><div class="l">Links conv. acum.</div></div>'
    +'</div>';
  h+='<div class="mon-sub">Conclusão média por dia</div>';
  h+='<div class="mon-hist">'+serie.map(x=>{ const ht=Math.round(x.pct/maxP*58)+4; return '<div class="col"><div class="bar" style="height:'+ht+'px;background:'+_cor(x.pct)+'"></div><div class="dl">'+x.dd+'</div></div>'; }).join('')+'</div>';
  h+='</div>';
  return h;
}

function render(){
  const st=stats();
  let h=`<div class="card">
    <div class="hd"><div class="nm">${esc(PESSOA.nome)}</div><div class="lj">${esc(PESSOA.loja)} · ${PESSOA.papel==='lider'?'🧭 Líder':'🧑‍💼 Consultor'}</div></div>
    <div class="top"><span class="d">📅 ${DATA.split('-').reverse().join('/')}</span><strong>${st.feitos}/${st.total} · ${st.pct}%</strong></div>
    <div class="prog"><span style="width:${st.pct}%"></span></div>
  </div>`;
  blocos().forEach(b=>{
    h+=`<div class="card"><div class="btit">${esc(b.bloco)}</div>`;
    b.itens.forEach(it=>{
      const r=reg(it.key); const done=r&&r.feito;
      if(it.type==='count'){
        const c=r?Number(r.contador)||0:0;
        const temMeta = typeof it.meta==='number';
        const metaTxt = temMeta ? ` <span style="color:var(--tx3);font-size:11px">(meta ${it.meta})</span>` : '';
        const numTxt  = temMeta ? `${c}/${it.meta}` : `${c}`;
        const metaArg = temMeta ? it.meta : 'undefined';
        h+=`<div class="item ${done?'done':''}"><div class="chk">${done?'✓':''}</div>
          <div class="txt">${esc(it.txt)}${metaTxt}</div>
          <div class="cnt"><button onclick="count('${it.key}',-1,${metaArg})">−</button><span class="n">${numTxt}</span><button onclick="count('${it.key}',1,${metaArg})">+</button></div></div>`;
      } else {
        h+=`<div class="item ${done?'done':''}" onclick="toggle('${it.key}')"><div class="chk">${done?'✓':''}</div><div class="txt">${esc(it.txt)}</div></div>`;
      }
    });
    h+='</div>';
  });
  if(PESSOA.papel==='lider'){ h+=painelEquipe(); }
  h+=`<button class="btn" style="background:#132a5c;border:1px solid #24406b" onclick="gerarImagem()">📷 Gerar imagem do meu dia</button>`;
  h+=`<div class="msg">✅ Suas marcações são salvas automaticamente.</div>`;
  app.innerHTML=h;
}

// ── Gerador de imagem (card UniGames das atividades concluídas) ──
function _blend(hex,a,base){const h=x=>parseInt(x,16);const r1=h(hex.slice(1,3)),g1=h(hex.slice(3,5)),b1=h(hex.slice(5,7));const r2=h(base.slice(1,3)),g2=h(base.slice(3,5)),b2=h(base.slice(5,7));const m=(p,q)=>Math.round(a*p+(1-a)*q);return 'rgb('+m(r1,r2)+','+m(g1,g2)+','+m(b1,b2)+')';}
async function gerarImagem(){
  if(typeof html2canvas==='undefined'){ toast('Carregando… tente de novo'); return; }
  const st=stats();
  const uNavy='#132a5c',uNavy2='#0d1b3d',uSky='#cfe3ff',uSky2='#aecdf5',uWhite='#ffffff',uInk='#0f2148',uMut='#7f95c4',uGreen='#1e9e5c';
  // linhas: itens concluídos e pendentes
  const itens=blocos().flatMap(b=>b.itens.map(it=>({...it,bloco:b.bloco})));
  const feitosArr=itens.filter(it=>{const r=reg(it.key);return r&&r.feito;});
  const rowItem=(it,ok)=>{
    const r=reg(it.key); const c=r?Number(r.contador)||0:0;
    let extra='';
    if(it.type==='count'){ extra = (typeof it.meta==='number') ? (' ('+c+'/'+it.meta+')') : (' · '+c); }
    // itens de resultado: valor em destaque (verde se >0), sem marca de pendente
    if(it.resultado){
      const val = it.type==='count' ? c : (ok?'✓':'—');
      const cor2 = (it.type==='count'? c>0 : ok) ? uGreen : uMut;
      return '<div style="display:flex;gap:9px;align-items:center;padding:5px 0;font-size:12.5px;color:'+uInk+'">'
        +'<span style="flex:1;line-height:1.35">'+esc(it.txt)+'</span>'
        +'<strong style="color:'+cor2+';flex-shrink:0">'+val+'</strong></div>';
    }
    const cor= ok? uGreen : '#c25b5b';
    const ic = ok? '✓' : '○';
    return '<div style="display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px;color:'+uInk+'">'
      +'<span style="color:'+cor+';font-weight:900;flex-shrink:0">'+ic+'</span>'
      +'<span style="flex:1;line-height:1.35;'+(ok?'':'opacity:.55')+'">'+esc(it.txt)+extra+'</span></div>';
  };
  const listaHTML=itens.map(it=>{const r=reg(it.key);return rowItem(it, r&&r.feito);}).join('');
  const barCor = st.pct>=80?uGreen:(st.pct>=40?'#c77700':'#c25b5b');
  const hojeTxt=DATA.split('-').reverse().join('/');
  const cardHTML='<div style="width:400px;background:'+uNavy2+';border:1px solid '+_blend(uSky,.22,uNavy2)+';border-radius:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;box-sizing:border-box">'
    +'<div style="height:6px;background:linear-gradient(90deg,'+uSky+','+uNavy+','+uSky+')"></div>'
    +'<div style="padding:20px 26px 10px;text-align:center">'
      +'<div style="font-size:26px;font-weight:900;color:'+uWhite+';letter-spacing:-.03em;line-height:1">Unigames</div>'
      +'<div style="font-size:8px;font-weight:800;letter-spacing:.42em;text-transform:uppercase;color:'+uSky2+';margin-top:3px">Lugar de Tecnologia</div>'
    +'</div>'
    +'<div style="text-align:center;padding:2px 26px 6px"><span style="display:inline-block;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:'+uInk+';background:'+uSky+';border-radius:22px;padding:7px 18px">🎯 Rotina Comercial</span></div>'
    +'<div style="text-align:center;padding:0 26px 12px"><div style="font-size:20px;font-weight:900;color:'+uWhite+';line-height:1.1">'+esc(PESSOA.nome)+'</div>'
      +'<div style="font-size:12px;font-weight:600;color:'+uSky2+';margin-top:2px">'+esc(PESSOA.loja)+' · '+(PESSOA.papel==='lider'?'Líder':'Consultor')+' · '+hojeTxt+'</div></div>'
    +'<div style="margin:0 22px 16px;background:'+uWhite+';border-radius:18px;padding:18px">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span style="font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:'+uMut+'">Progresso do dia</span><strong style="font-size:15px;color:'+uInk+'">'+st.feitos+'/'+st.total+' · '+st.pct+'%</strong></div>'
      +'<div style="height:11px;border-radius:7px;background:'+_blend(uSky,.5,uWhite)+';overflow:hidden;margin-bottom:14px"><div style="height:100%;width:'+st.pct+'%;background:'+barCor+';border-radius:7px"></div></div>'
      +listaHTML
    +'</div>'
    +'<div style="padding:0 26px 18px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:8.5px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:'+uMut+'">UniGames · Rotina</span><span style="font-size:8.5px;color:'+uMut+'">Gerado em '+new Date().toLocaleDateString('pt-BR')+'</span></div>'
  +'</div>';

  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;left:-9999px;top:0;z-index:-1;pointer-events:none';
  wrap.innerHTML=cardHTML;
  document.body.appendChild(wrap);
  const el=wrap.firstElementChild;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const canvas=await html2canvas(el,{scale:3,useCORS:true,allowTaint:true,backgroundColor:'#0d1b3d',logging:false});
    wrap.remove();
    const dataUrl=canvas.toDataURL('image/png');
    preview(dataUrl,'rotina_'+String(PESSOA.nome||'').toLowerCase().replace(/[^a-z0-9]/gi,'_')+'.png');
  }catch(e){ wrap.remove(); toast('Erro ao gerar imagem'); }
}
function preview(dataUrl,fname){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px';
  ov.innerHTML='<img src="'+dataUrl+'" style="max-width:92vw;max-height:66vh;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.5)">'
    +'<div style="display:flex;gap:10px"><a href="'+dataUrl+'" download="'+fname+'" style="background:#4d8ef7;color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:800;text-decoration:none">⬇️ Baixar</a>'
    +'<button id="pvx" style="background:#1b2236;color:#cbd5e1;border:1px solid #3a425c;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:800">Fechar</button></div>'
    +'<div style="color:#cbd5e1;font-size:12px;text-align:center;max-width:320px;line-height:1.5">No celular: toque e segure a imagem para salvar na galeria.</div>';
  ov.querySelector('#pvx').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}
boot();
</script>
